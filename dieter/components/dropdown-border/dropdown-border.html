<div
  class="diet-dropdown-border diet-popover-host"
  data-size="{{size}}"
  data-state="{{state}}"
>
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-border__value-field"
    value='{{value}}'
    {{#if path}}data-path="{{path}}"{{/if}}
    data-dieter-json
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-border__control"
    aria-haspopup="dialog"
    aria-expanded="{{expanded}}"
    aria-labelledby="{{id}}-label"
  >
    <span class="diet-dropdown-header-label" id="{{id}}-label">{{label}}</span>
    <span class="diet-dropdown-header-value">
      <span class="diet-dropdown-border__label"></span>
      <span class="diet-dropdown-border__chip" aria-hidden="true"></span>
      <span
        class="diet-icon diet-dropdown-border__none-icon"
        data-icon="square.slash"
        aria-hidden="true"
        hidden
      ></span>
    </span>
  </button>

  <div
    class="diet-popover diet-dropdown-border__popover"
    data-width="{{popoverWidth}}"
    role="dialog"
    aria-labelledby="{{id}}-popover-label"
    data-state="{{state}}"
  >
    <div class="diet-popover__header">
      <span class="diet-popover__header-label" id="{{id}}-popover-label">{{label}}</span>
    </div>
    <div class="diet-popover__body">
      <label class="diet-toggle diet-toggle--block" data-size="{{size}}">
        <span class="diet-toggle__label" id="{{id}}-enabled-label">{{enabledLabel}}</span>
        <input
          id="{{id}}-enabled"
          class="diet-toggle__input sr-only diet-dropdown-border__enabled"
          type="checkbox"
          role="switch"
          aria-labelledby="{{id}}-enabled-label"
        />
        <span class="diet-toggle__switch" aria-hidden="true">
          <span class="diet-toggle__knob"></span>
        </span>
      </label>

      <div class="diet-dropdown-border__dependent-controls">
        <div class="diet-dropdown-border__preview" aria-label="{{colorLabel}}">
          <div class="diet-dropdown-border__color-preview"></div>
          <input
            type="color"
            class="diet-dropdown-border__native-color"
            aria-label="{{colorLabel}}"
            tabindex="-1"
          />
        </div>

        <div class="diet-dropdown-border__sv" data-role="sv">
          <div class="diet-dropdown-border__sv-canvas">
            <div class="diet-dropdown-border__sv-thumb" aria-hidden="true"></div>
          </div>
        </div>

        <div
          class="diet-dropdown-border__slider diet-dropdown-border__slider--hue diet-slider"
          data-size="{{size}}"
        >
          <span class="diet-slider__label" id="{{id}}-hue-label">{{hueLabel}}</span>
          <input
            type="range"
            min="0"
            max="360"
            step="1"
            class="diet-slider__input diet-dropdown-border__hue"
            aria-labelledby="{{id}}-hue-label"
          />
        </div>

        <div
          class="diet-textfield diet-dropdown-border__hex-control"
          data-size="{{size}}"
          data-role="hex"
        >
          <label class="diet-textfield__control">
            <span class="diet-textfield__display-label" id="{{id}}-hex-label">{{hexLabel}}</span>
            <input
              type="text"
              class="diet-textfield__field diet-dropdown-border__hex"
              aria-labelledby="{{id}}-hex-label"
              placeholder="RRGGBB"
              inputmode="text"
              autocapitalize="off"
              autocomplete="off"
              spellcheck="false"
              maxlength="6"
              pattern="^[0-9a-fA-F]{0,6}$"
            />
          </label>
        </div>

        <div
          class="diet-dropdown-border__swatches"
          role="group"
          aria-label="{{defaultColorsLabel}}"
        >
          <button type="button" class="diet-dropdown-border__swatch" data-color="#ff3b30" aria-label="{{colorLabel}} #ff3b30" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#ff9500" aria-label="{{colorLabel}} #ff9500" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#ffcc00" aria-label="{{colorLabel}} #ffcc00" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#34c759" aria-label="{{colorLabel}} #34c759" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#30b0c7" aria-label="{{colorLabel}} #30b0c7" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#007aff" aria-label="{{colorLabel}} #007aff" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#32ade6" aria-label="{{colorLabel}} #32ade6" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#00c7be" aria-label="{{colorLabel}} #00c7be" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#5856d6" aria-label="{{colorLabel}} #5856d6" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#af52de" aria-label="{{colorLabel}} #af52de" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#ff2d55" aria-label="{{colorLabel}} #ff2d55" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#a2845e" aria-label="{{colorLabel}} #a2845e" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#212121" aria-label="{{colorLabel}} #212121" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#aeaeb2" aria-label="{{colorLabel}} #aeaeb2" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#c7c7cc" aria-label="{{colorLabel}} #c7c7cc" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#d1d1d6" aria-label="{{colorLabel}} #d1d1d6" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#e5e5ea" aria-label="{{colorLabel}} #e5e5ea" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
          <button type="button" class="diet-dropdown-border__swatch" data-color="#ffffff" aria-label="{{colorLabel}} #ffffff" aria-pressed="false"><span class="diet-dropdown-border__swatch-dot" aria-hidden="true"></span></button>
        </div>

        <div
          class="diet-dropdown-border__slider diet-dropdown-border__slider--width diet-slider"
          data-size="{{size}}"
        >
          <span class="diet-slider__label" id="{{id}}-width-label">{{widthLabel}}</span>
          <input
            id="{{id}}-width"
            class="diet-slider__input diet-dropdown-border__width"
            type="range"
            min="0"
            max="12"
            step="1"
            value="1"
            aria-labelledby="{{id}}-width-label"
          />
        </div>
      </div>
    </div>
  </div>
</div>
