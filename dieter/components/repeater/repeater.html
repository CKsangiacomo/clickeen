<div class="diet-repeater" data-size="{{size}}" data-reorder="off" data-reorder-label="{{reorderLabel}}" data-remove-label="{{removeLabel}}" data-move-label="{{moveLabel}}"{{#if defaultItem}} data-default-item="{{defaultItem}}"{{/if}}{{#if addOpen}} data-add-open="{{addOpen}}"{{/if}}{{#if min}} data-min-items="{{min}}"{{/if}}{{#if max}} data-max-items="{{max}}"{{/if}}>
  <div class="diet-repeater__header {{#if labelPath}}has-editable-label{{/if}}">
    <div class="diet-repeater__header-main">
      {{#if labelPath}}
        <div class="diet-textfield diet-repeater__label-input" data-size="lg">
          <label class="diet-textfield__control">
            <span class="diet-textfield__display-label label-m">{{labelInputLabel}}</span>
            <input
              class="diet-textfield__field body-m"
              type="text"
              aria-label="{{labelInputLabel}}"
              placeholder="{{labelPlaceholder}}"
              data-bob-path="{{labelPath}}"
            />
          </label>
        </div>
      {{else}}
        <span class="diet-repeater__label label-s">{{label}}</span>
      {{/if}}

      <div class="diet-repeater__actions">
        <button class="diet-button diet-tooltip diet-repeater__reorder" type="button" data-size="large" data-type="quaternary" aria-label="{{reorderLabel}}" data-tooltip="{{reorderLabel}}" data-tooltip-placement="left" aria-pressed="false">
          <span class="diet-icon diet-repeater__reorder-icon" data-icon="pointer.arrow.and.square.on.square.dashed" aria-hidden="true" data-size="20"></span>
          <span class="diet-icon diet-repeater__reorder-icon--active" data-icon="checkmark" aria-hidden="true" data-size="20"></span>
        </button>
      </div>
    </div>

    {{#if togglePath}}
      <div class="diet-repeater__toggle-row">
        <label class="diet-toggle diet-repeater__toggle" data-size="sm">
          <span class="diet-toggle__label label-s">{{toggleLabel}}</span>
          <input
            class="diet-toggle__input sr-only"
            type="checkbox"
            role="switch"
            aria-label="{{toggleLabel}}"
            data-bob-path="{{togglePath}}"
          />
          <span class="diet-toggle__switch">
            <span class="diet-toggle__knob"></span>
          </span>
        </label>
      </div>
    {{/if}}
  </div>

  <div class="diet-repeater__list" data-repeater-list></div>

  <div class="diet-repeater__icon-stash" aria-hidden="true" hidden>
    <span class="diet-icon diet-repeater__icon-handle" data-size="12" data-icon="arrow.up.arrow.down"></span>
    <span class="diet-icon diet-repeater__icon-trash" data-size="12" data-icon="trash"></span>
  </div>

  <button class="diet-button diet-repeater__add" type="button" data-size="medium" data-type="secondary">
    <span class="diet-button__label">{{addLabel}}</span>
  </button>

  <input type="hidden" class="diet-repeater__field" value="[]"{{#if path}} data-path="{{path}}"{{/if}} data-dieter-json />

  <template data-repeater-item>{{template}}</template>
</div>
