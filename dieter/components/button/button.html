<button class="diet-button" data-size="{{size}}" data-type="{{type}}"{{#if state}} data-state="{{state}}"{{/if}} type="button"{{#if loading}} data-loading="true" aria-busy="true"{{/if}}{{#if ariaLabel}} aria-label="{{ariaLabel}}"{{/if}}{{#if disabled}} disabled{{/if}}{{#if tabIndex}} tabindex="{{tabIndex}}"{{/if}}{{#if path}} data-path="{{path}}"{{/if}}>
  {{#if loading}}
  <span class="diet-spinner" aria-hidden="true"></span>
  {{/if}}
  {{#unless loading}}
  {{#if iconStart}}
  <span class="diet-icon"{{#if iconSize}} data-size="{{iconSize}}"{{/if}} data-icon="{{iconStart}}" aria-hidden="true"></span>
  {{/if}}
  {{/unless}}
  {{#if label}}
  <span class="diet-button__label">{{label}}</span>
  {{/if}}
  {{#unless loading}}
  {{#if iconEnd}}
  <span class="diet-icon"{{#if iconSize}} data-size="{{iconSize}}"{{/if}} data-icon="{{iconEnd}}" aria-hidden="true"></span>
  {{/if}}
  {{/unless}}
</button>
