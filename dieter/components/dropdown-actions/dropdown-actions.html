<div class="diet-dropdown-actions diet-popover-host" data-size="{{size}}" data-state="{{state}}">
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-actions__value-field"
    value="{{value}}"
    {{#if path}}data-path="{{path}}"{{/if}}
    data-placeholder="{{placeholder}}"
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-actions__control"
    aria-haspopup="listbox"
    aria-expanded="{{expanded}}"
    {{#if label}}aria-labelledby="{{id}}-label"{{/if}}
  >
    {{#if label}}
      <span
        class="diet-dropdown-header-label"
        id="{{id}}-label"
      >{{label}}</span>
    {{/if}}
    <span class="diet-dropdown-header-value" data-muted="true" data-placeholder="{{placeholder}}">
      <span class="diet-dropdown-actions__value">{{placeholder}}</span>
    </span>
  </button>

  <div
    class="diet-popover diet-dropdown-actions__popover"
    role="listbox"
    aria-label="{{label}}"
    data-state="{{state}}"
  >
    <div class="diet-popover__header">
      <span class="diet-popover__header-label">{{label}}</span>
    </div>
    <div class="diet-popover__body diet-dropdown-actions__menu">
      {{#each options}}
      {{#if isGroupHeader}}
      <div class="diet-dropdown-actions__group-label overline-small" role="presentation">{{label}}</div>
      {{else}}
      <button
        type="button"
        class="diet-btn-menuactions diet-dropdown-actions__menuaction{{#if selected}} is-selected{{/if}}"
        data-size="{{../size}}"
        data-variant="neutral"
        data-value="{{value}}"
        data-label="{{label}}"
        role="option"
        {{#if selected}}aria-selected="true" data-selected="true"{{/if}}
      >
        <span class="diet-btn-menuactions__label">
          <span class="diet-dropdown-actions__menuaction-text">{{label}}</span>
          {{#if badge}}
          <span class="diet-dropdown-actions__badge caption">{{badge}}</span>
          {{/if}}
        </span>
        <span class="diet-btn-menuactions__icon" aria-hidden="true">
          <span class="diet-dropdown-actions__check diet-icon" data-icon="checkmark" aria-hidden="true"></span>
        </span>
      </button>
      {{/if}}
      {{/each}}
    </div>
  </div>
</div>
