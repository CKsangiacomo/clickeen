<div class="diet-textarea diet-textfield diet-popover-host" data-size="{{size}}" data-state="closed">
  <input
    id="{{id}}"
    type="hidden"
    class="diet-textarea__value-field"
    value="{{value}}"
    data-placeholder="{{placeholder}}"
    {{#if path}}data-path="{{path}}"{{/if}}
  />

  <button
    type="button"
    class="diet-textfield__control diet-textarea__control"
    aria-haspopup="dialog"
    aria-expanded="false"
    {{#if label}}aria-labelledby="{{id}}-label {{id}}-preview"{{else}}aria-labelledby="{{id}}-preview"{{/if}}
    {{#if disabled}}disabled{{/if}}
  >
    {{#if label}}
      <span id="{{id}}-label" class="diet-textfield__display-label {{labelClass}}">{{label}}</span>
    {{/if}}
    <span id="{{id}}-preview" class="diet-textarea__preview {{bodyClass}}" data-muted="{{#if value}}false{{else}}true{{/if}}">{{#if value}}{{value}}{{else}}{{placeholder}}{{/if}}</span>
  </button>

  <div class="diet-popover diet-textarea__popover" role="dialog" {{#if label}}aria-labelledby="{{id}}-popover-label"{{else}}aria-label="{{placeholder}}"{{/if}}>
    {{#if label}}
      <div class="diet-popover__header">
        <span id="{{id}}-popover-label" class="diet-popover__header-label {{labelClass}}">{{label}}</span>
      </div>
    {{/if}}
    <div class="diet-popover__body">
      <textarea
        id="{{id}}-editor"
        class="diet-textarea__editor {{bodyClass}}"
        placeholder="{{placeholder}}"
        {{#if label}}aria-labelledby="{{id}}-popover-label"{{else}}aria-label="{{placeholder}}"{{/if}}
        {{#if maxlength}}maxlength="{{maxlength}}"{{/if}}
        {{#if disabled}}disabled{{/if}}
      >{{value}}</textarea>
    </div>
  </div>
</div>
