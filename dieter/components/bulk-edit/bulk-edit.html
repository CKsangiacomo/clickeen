<div
  class="diet-bulk-edit"
  data-size="{{size}}"
  data-bulk-path="{{path}}"
  data-row-path="{{rowPath}}"
  data-columns="{{columns}}"
  data-empty-label="{{emptyLabel}}"
>
  <div class="diet-bulk-edit__trigger">
    <button class="diet-button" type="button" data-size="{{buttonSize}}" data-type="secondary" data-bulk-open>
      <span class="diet-button__label">{{label}}</span>
    </button>
  </div>

  <input type="hidden" class="diet-bulk-edit__field" value="[]" data-path="{{path}}" data-dieter-json />

  <dialog class="diet-popup" data-size="large" aria-label="{{title}}" data-bulk-modal>
    <div class="diet-bulk-edit__editor" data-bulk-editor>
      <header class="diet-popup__header">
        <h2 class="diet-bulk-edit__title heading-4">{{title}}</h2>
        <button class="diet-button diet-popup__dismiss" type="button" data-size="medium" data-type="quaternary" aria-label="{{closeLabel}}" data-bulk-close>
          <span class="diet-icon" data-icon="multiply" aria-hidden="true"></span>
        </button>
      </header>
      <div class="diet-popup__body">
        <div class="diet-table" data-bulk-table></div>
      </div>
      <footer class="diet-popup__footer">
        <div class="diet-popup__actions">
          <button class="diet-button" type="button" data-size="medium" data-type="secondary" data-bulk-cancel>
            <span class="diet-button__label">{{cancelLabel}}</span>
          </button>
          <button class="diet-button" type="button" data-size="medium" data-type="primary" data-bulk-save>
            <span class="diet-button__label">{{saveLabel}}</span>
          </button>
        </div>
      </footer>
    </div>
    <div class="diet-bulk-edit__editor" data-bulk-discard hidden>
      <header class="diet-popup__header">
        <h2 class="diet-bulk-edit__title heading-4">{{discardTitle}}</h2>
      </header>
      <div class="diet-popup__body">
        <p class="body-s">{{discardMessage}}</p>
      </div>
      <footer class="diet-popup__footer">
        <div class="diet-popup__actions">
          <button class="diet-button" type="button" data-size="medium" data-type="secondary" data-bulk-keep-editing>
            <span class="diet-button__label">{{keepEditingLabel}}</span>
          </button>
          <button class="diet-button" type="button" data-size="medium" data-type="primary" data-bulk-discard-changes>
            <span class="diet-button__label">{{discardLabel}}</span>
          </button>
        </div>
      </footer>
    </div>
  </dialog>
</div>
