<div
  class="diet-dropdown-fill diet-popover-host"
  data-size="{{size}}"
  data-state="{{state}}"
  data-mode="color"
  data-fill-modes="{{fillModes}}"
  data-copy-add-gradient-stop="{{addGradientStopLabel}}"
  data-copy-edit-gradient-stop="{{editGradientStopLabel}}"
  data-copy-load-assets-error="{{loadAssetsErrorLabel}}"
  data-copy-loading-assets="{{loadingAssetsLabel}}"
  data-copy-no-assets="{{noAssetsLabel}}"
  data-copy-preview-asset-error="{{previewAssetErrorLabel}}"
  data-copy-remove-gradient-stop="{{removeGradientStopLabel}}"
  data-copy-upload-asset-error="{{uploadAssetErrorLabel}}"
  data-copy-use-asset="{{useAssetLabel}}"
>
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-fill__value-field"
    value='{{value}}'
    {{#if path}}data-path="{{path}}"{{/if}}
    data-placeholder="{{placeholder}}"
    data-dieter-json
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-fill__control"
    aria-haspopup="dialog"
    aria-expanded="{{expanded}}"
    {{#if label}}aria-labelledby="{{id}}-label"{{/if}}
  >
    {{#if label}}
      <span
        class="diet-dropdown-header-label {{labelClass}}"
        id="{{id}}-label"
      >{{label}}</span>
    {{/if}}
    <span class="diet-dropdown-header-value {{bodyClass}}" data-muted="true" data-placeholder="{{placeholder}}">
      <span class="diet-dropdown-fill__label">{{placeholder}}</span>
      <span class="diet-icon diet-dropdown-fill__none-icon" data-icon="square.slash" aria-hidden="true"></span>
      <span class="diet-dropdown-fill__chip" aria-hidden="true" hidden></span>
    </span>
  </button>

  <div
    class="diet-popover diet-dropdown-fill__popover"
    data-width="{{popoverWidth}}"
    role="dialog"
    aria-labelledby="{{id}}-popover-label"
    data-state="{{state}}"
  >
    <div class="diet-popover__header">
      <span class="diet-popover__header-label" id="{{id}}-popover-label">{{label}}</span>
    </div>
    <div class="diet-popover__body">
      <label class="diet-toggle diet-toggle--block diet-dropdown-fill__enabled" data-size="{{size}}">
        <span class="diet-toggle__label" id="{{id}}-enabled-label">{{enabledLabel}}</span>
        <input
          class="diet-toggle__input diet-dropdown-fill__enabled-input sr-only"
          type="checkbox"
          role="switch"
          aria-labelledby="{{id}}-enabled-label"
        />
        <span class="diet-toggle__switch" aria-hidden="true">
          <span class="diet-toggle__knob"></span>
        </span>
      </label>

      <div class="diet-segmented diet-segmented-ic diet-dropdown-fill__modes" role="radiogroup" data-size="{{size}}" aria-label="{{label}}" hidden>
        <label class="diet-segment diet-dropdown-fill__mode" data-mode="color">
          <input class="diet-segment__input diet-dropdown-fill__mode-input" type="radio" name="{{id}}-mode" value="color" checked />
          <span class="diet-segment__surface" aria-hidden="true"></span>
          <span class="diet-segment__content">
            <span class="diet-icon" data-size="20" data-icon="circle.lefthalf.filled" aria-hidden="true"></span>
            <span class="diet-segment__sr">{{colorFillLabel}}</span>
          </span>
        </label>
        <label class="diet-segment diet-dropdown-fill__mode" data-mode="gradient">
          <input class="diet-segment__input diet-dropdown-fill__mode-input" type="radio" name="{{id}}-mode" value="gradient" />
          <span class="diet-segment__surface" aria-hidden="true"></span>
          <span class="diet-segment__content">
            <span class="diet-icon" data-size="20" data-icon="circle.dotted" aria-hidden="true"></span>
            <span class="diet-segment__sr">{{gradientFillLabel}}</span>
          </span>
        </label>
        <label class="diet-segment diet-dropdown-fill__mode" data-mode="image">
          <input class="diet-segment__input diet-dropdown-fill__mode-input" type="radio" name="{{id}}-mode" value="image" />
          <span class="diet-segment__surface" aria-hidden="true"></span>
          <span class="diet-segment__content">
            <span class="diet-icon" data-size="20" data-icon="photo" aria-hidden="true"></span>
            <span class="diet-segment__sr">{{imageFillLabel}}</span>
          </span>
        </label>
        <label class="diet-segment diet-dropdown-fill__mode" data-mode="video">
          <input class="diet-segment__input diet-dropdown-fill__mode-input" type="radio" name="{{id}}-mode" value="video" />
          <span class="diet-segment__surface" aria-hidden="true"></span>
          <span class="diet-segment__content">
            <span class="diet-icon" data-size="20" data-icon="play.square" aria-hidden="true"></span>
            <span class="diet-segment__sr">{{videoFillLabel}}</span>
          </span>
        </label>
      </div>

      <div class="diet-dropdown-fill__editor" hidden>
        <div class="diet-dropdown-fill__panel diet-dropdown-fill__panel--color body-xs" data-panel="color">
          <div class="diet-dropdown-fill__sv" data-role="sv">
            <div class="diet-dropdown-fill__sv-canvas">
              <div class="diet-dropdown-fill__sv-thumb" aria-hidden="true"></div>
            </div>
          </div>

          <div class="diet-dropdown-fill__sliders">
            <div class="diet-dropdown-fill__slider diet-dropdown-fill__slider--hue diet-slider" data-size="{{size}}">
              <span class="diet-slider__label" id="{{id}}-hue-label">{{hueLabel}}</span>
              <input
                type="range"
                min="0"
                max="360"
                step="1"
                class="diet-slider__input diet-dropdown-fill__hue"
                aria-labelledby="{{id}}-hue-label"
              />
            </div>
            <div class="diet-dropdown-fill__slider diet-dropdown-fill__slider--alpha diet-slider" data-size="{{size}}">
              <span class="diet-slider__label" id="{{id}}-opacity-label">{{opacityLabel}}</span>
              <input
                type="range"
                min="0"
                max="100"
                step="1"
                class="diet-slider__input diet-dropdown-fill__alpha"
                aria-labelledby="{{id}}-opacity-label"
              />
              <output class="diet-dropdown-fill__slider-value body-s">100%</output>
            </div>
          </div>

          <div class="diet-dropdown-fill__fields">
            <div class="diet-textfield" data-size="{{size}}" data-role="hex">
              <label class="diet-textfield__control">
                <span class="diet-textfield__display-label label-s" id="{{id}}-hex-label">{{hexLabel}}</span>
                <input
                  type="text"
                  class="diet-textfield__field body-s diet-dropdown-fill__hex"
                  aria-labelledby="{{id}}-hex-label"
                  placeholder="RRGGBB"
                  inputmode="text"
                  autocapitalize="off"
                  autocomplete="off"
                  spellcheck="false"
                  maxlength="6"
                  pattern="^[0-9a-fA-F]{0,6}$"
                />
              </label>
            </div>
          </div>

          <div class="diet-dropdown-fill__swatches" role="group" aria-label="{{defaultColorsLabel}}" data-swatch-target="color">
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff3b30" aria-label="{{colorLabel}} #ff3b30" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff9500" aria-label="{{colorLabel}} #ff9500" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ffcc00" aria-label="{{colorLabel}} #ffcc00" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#34c759" aria-label="{{colorLabel}} #34c759" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#30b0c7" aria-label="{{colorLabel}} #30b0c7" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#007aff" aria-label="{{colorLabel}} #007aff" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#32ade6" aria-label="{{colorLabel}} #32ade6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#00c7be" aria-label="{{colorLabel}} #00c7be" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#5856d6" aria-label="{{colorLabel}} #5856d6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#af52de" aria-label="{{colorLabel}} #af52de" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff2d55" aria-label="{{colorLabel}} #ff2d55" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#a2845e" aria-label="{{colorLabel}} #a2845e" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#212121" aria-label="{{colorLabel}} #212121" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#aeaeb2" aria-label="{{colorLabel}} #aeaeb2" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#c7c7cc" aria-label="{{colorLabel}} #c7c7cc" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#d1d1d6" aria-label="{{colorLabel}} #d1d1d6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#e5e5ea" aria-label="{{colorLabel}} #e5e5ea" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ffffff" aria-label="{{colorLabel}} #ffffff" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          </div>

        </div>

        <div class="diet-dropdown-fill__panel diet-dropdown-fill__panel--gradient body-xs" data-panel="gradient">
          <div class="diet-dropdown-fill__gradient-preview" aria-hidden="true"></div>
          <div class="diet-dropdown-fill__sliders">
            <div class="diet-dropdown-fill__slider diet-dropdown-fill__slider--angle diet-slider" data-size="{{size}}">
              <span class="diet-slider__label" id="{{id}}-angle-label">{{angleLabel}}</span>
              <input
                type="range"
                min="0"
                max="360"
                step="1"
                class="diet-slider__input diet-dropdown-fill__gradient-angle"
                aria-labelledby="{{id}}-angle-label"
              />
            </div>
          </div>
          <div class="diet-dropdown-fill__gradient-stopbar" role="group" aria-label="{{gradientStopsLabel}}">
            <div class="diet-dropdown-fill__gradient-stop-track">
              <span class="diet-dropdown-fill__gradient-stop-line" aria-hidden="true"></span>
            </div>
            <button type="button" class="diet-button diet-dropdown-fill__gradient-stop-add" data-size="{{buttonSize}}" data-type="quaternary" aria-label="{{addGradientStopLabel}}">
              <span class="diet-icon diet-dropdown-fill__gradient-stop-add-icon" data-icon="plus" aria-hidden="true"></span>
              <span class="diet-icon diet-dropdown-fill__gradient-stop-remove-icon" data-icon="minus" aria-hidden="true" hidden></span>
            </button>
          </div>
          <div class="diet-dropdown-fill__gradient-editor">
            <div class="diet-dropdown-fill__gradient-sv" data-role="gradient-sv">
              <div class="diet-dropdown-fill__gradient-sv-canvas">
                <div class="diet-dropdown-fill__gradient-sv-thumb" aria-hidden="true"></div>
              </div>
            </div>
            <div class="diet-dropdown-fill__gradient-sliders">
              <div class="diet-dropdown-fill__slider diet-dropdown-fill__slider--hue diet-slider" data-size="{{size}}">
                <span class="diet-slider__label" id="{{id}}-gradient-hue-label">{{hueLabel}}</span>
                <input
                  type="range"
                  min="0"
                  max="360"
                  step="1"
                  class="diet-slider__input diet-dropdown-fill__gradient-hue"
                  aria-labelledby="{{id}}-gradient-hue-label"
                />
              </div>
              <div class="diet-dropdown-fill__slider diet-dropdown-fill__slider--alpha diet-slider" data-size="{{size}}">
                <span class="diet-slider__label" id="{{id}}-gradient-opacity-label">{{opacityLabel}}</span>
                <input
                  type="range"
                  min="0"
                  max="100"
                  step="1"
                  class="diet-slider__input diet-dropdown-fill__gradient-alpha"
                  aria-labelledby="{{id}}-gradient-opacity-label"
                />
                <output class="diet-dropdown-fill__slider-value body-s">100%</output>
              </div>
            </div>
            <div class="diet-dropdown-fill__fields">
              <div class="diet-textfield" data-size="{{size}}">
                <label class="diet-textfield__control">
                  <span class="diet-textfield__display-label label-s" id="{{id}}-gradient-hex-label">{{hexLabel}}</span>
                  <input
                    type="text"
                    class="diet-textfield__field body-s diet-dropdown-fill__gradient-hex"
                    aria-labelledby="{{id}}-gradient-hex-label"
                    placeholder="#ff3b30"
                    inputmode="text"
                    autocapitalize="off"
                    autocomplete="off"
                    spellcheck="false"
                    maxlength="7"
                    pattern="^#?[0-9a-fA-F]{0,6}$"
                  />
                </label>
              </div>
            </div>
          </div>
          <div class="diet-dropdown-fill__swatches" role="group" aria-label="{{defaultColorsLabel}}" data-swatch-target="gradient">
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff3b30" aria-label="{{colorLabel}} #ff3b30" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff9500" aria-label="{{colorLabel}} #ff9500" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ffcc00" aria-label="{{colorLabel}} #ffcc00" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#34c759" aria-label="{{colorLabel}} #34c759" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#30b0c7" aria-label="{{colorLabel}} #30b0c7" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#007aff" aria-label="{{colorLabel}} #007aff" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#32ade6" aria-label="{{colorLabel}} #32ade6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#00c7be" aria-label="{{colorLabel}} #00c7be" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#5856d6" aria-label="{{colorLabel}} #5856d6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#af52de" aria-label="{{colorLabel}} #af52de" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ff2d55" aria-label="{{colorLabel}} #ff2d55" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#a2845e" aria-label="{{colorLabel}} #a2845e" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#212121" aria-label="{{colorLabel}} #212121" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#aeaeb2" aria-label="{{colorLabel}} #aeaeb2" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#c7c7cc" aria-label="{{colorLabel}} #c7c7cc" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#d1d1d6" aria-label="{{colorLabel}} #d1d1d6" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#e5e5ea" aria-label="{{colorLabel}} #e5e5ea" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          <button type="button" class="diet-dropdown-fill__swatch" data-color="#ffffff" aria-label="{{colorLabel}} #ffffff" aria-pressed="false">
            <span class="diet-dropdown-fill__swatch-dot" aria-hidden="true"></span>
          </button>
          </div>
        </div>

        <div class="diet-dropdown-fill__panel diet-dropdown-fill__panel--image body-xs" data-panel="image" data-has-image="false">
        <div class="diet-dropdown-fill__image-preview" aria-hidden="true">
          <span class="diet-dropdown-fill__empty-media-icon" data-icon="photo"></span>
        </div>
        <div class="diet-dropdown-fill__image-actions">
          <div class="diet-dropdown-fill__image-controls-left">
            <button
              type="button"
              class="diet-button diet-dropdown-fill__upload-btn"
              data-size="{{buttonSize}}"
              data-type="tertiary"
              aria-label="{{uploadLabel}}"
              title="{{uploadLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="square.and.arrow.up"></span>
            </button>
            <button
              type="button"
              class="diet-button diet-dropdown-fill__choose-btn"
              data-size="{{buttonSize}}"
              data-type="tertiary"
              aria-label="{{chooseAssetsLabel}}"
              title="{{chooseAssetsLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="tray"></span>
            </button>
          </div>
          <div class="diet-dropdown-fill__image-controls-right">
            <button
              type="button"
              class="diet-button diet-dropdown-fill__remove-btn"
              data-size="{{buttonSize}}"
              data-type="quaternary"
              aria-label="{{removeAssetLabel}}"
              title="{{removeAssetLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="trash"></span>
            </button>
          </div>
        </div>
        <div class="diet-dropdown-fill__asset-browser diet-dropdown-fill__asset-browser--image" hidden>
          <div class="diet-dropdown-fill__asset-browser-message body-s" role="status"></div>
          <div class="diet-dropdown-fill__asset-browser-list"></div>
        </div>
        <div class="diet-dropdown-fill__asset-message label-xs" role="alert" hidden></div>
        <input type="file" accept="image/*" class="diet-dropdown-fill__file-input" aria-hidden="true" tabindex="-1" />
        </div>

        <div class="diet-dropdown-fill__panel diet-dropdown-fill__panel--video body-xs" data-panel="video" data-has-video="false">
        <div class="diet-dropdown-fill__video-frame" aria-hidden="true">
          <video class="diet-dropdown-fill__video-preview" muted playsinline preload="metadata"></video>
          <div class="diet-dropdown-fill__video-placeholder">
            <span class="diet-dropdown-fill__empty-media-icon" data-icon="play.square"></span>
          </div>
        </div>
        <div class="diet-dropdown-fill__video-actions">
          <div class="diet-dropdown-fill__video-controls-left">
            <button
              type="button"
              class="diet-button diet-dropdown-fill__video-upload-btn"
              data-size="{{buttonSize}}"
              data-type="tertiary"
              aria-label="{{uploadLabel}}"
              title="{{uploadLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="square.and.arrow.up"></span>
            </button>
            <button
              type="button"
              class="diet-button diet-dropdown-fill__video-choose-btn"
              data-size="{{buttonSize}}"
              data-type="tertiary"
              aria-label="{{chooseAssetsLabel}}"
              title="{{chooseAssetsLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="tray"></span>
            </button>
          </div>
          <div class="diet-dropdown-fill__video-controls-right">
            <button
              type="button"
              class="diet-button diet-dropdown-fill__video-remove-btn"
              data-size="{{buttonSize}}"
              data-type="quaternary"
              aria-label="{{removeAssetLabel}}"
              title="{{removeAssetLabel}}"
            >
              <span class="diet-icon" aria-hidden="true" data-icon="trash"></span>
            </button>
          </div>
        </div>
        <div class="diet-dropdown-fill__asset-browser diet-dropdown-fill__asset-browser--video" hidden>
          <div class="diet-dropdown-fill__asset-browser-message body-s" role="status"></div>
          <div class="diet-dropdown-fill__asset-browser-list"></div>
        </div>
        <div class="diet-dropdown-fill__asset-message label-xs" role="alert" hidden></div>
        <input type="file" accept="video/*" class="diet-dropdown-fill__video-file-input" aria-hidden="true" tabindex="-1" />
        </div>
      </div>
    </div>
  </div>
</div>
