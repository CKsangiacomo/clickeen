<div class="diet-dropdown-edit diet-popover-host" data-size="{{size}}" data-state="{{state}}">
  <button type="button" class="diet-dropdown-header diet-dropdown-edit__control" aria-haspopup="dialog" aria-expanded="{{expanded}}">
    <span class="diet-dropdown-header-label {{#if labelClass}}{{labelClass}}{{else}}label-s{{/if}}">{{label}}</span>
    <span class="diet-dropdown-header-value {{#if bodyClass}}{{bodyClass}}{{else}}body-s{{/if}}" data-muted="true" data-placeholder="{{placeholder}}">
      <span class="diet-dropdown-edit__label">{{placeholder}}</span>
    </span>
  </button>

  <div class="diet-popover" data-width="{{popoverWidth}}" role="dialog" aria-label="{{label}}">
    <div class="diet-popover__header">
      <span class="diet-popover__header-label {{#if headerLabelClass}}{{headerLabelClass}}{{else}}label-s{{/if}}">
        {{#if headerLabel}}{{headerLabel}}{{else}}{{label}}{{/if}}
      </span>
    </div>
    <div class="diet-popover__body diet-dropdown-edit__body">
      <div class="diet-dropdown-edit__main">
        <div class="diet-dropdown-edit__editor" contenteditable="true">{{placeholder}}</div>
        <div class="diet-dropdown-edit__palette">
          <div class="diet-dropdown-edit__toolbarrow">
            <div class="diet-dropdown-edit__group diet-dropdown-edit__group--format">
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="bold"
                aria-label="{{boldLabel}}"
                aria-pressed="false"
              >
                <span class="diet-icon" data-icon="bold" data-size="20" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="italic"
                aria-label="{{italicLabel}}"
                aria-pressed="false"
              >
                <span class="diet-icon" data-icon="italic" data-size="20" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="underline"
                aria-label="{{underlineLabel}}"
                aria-pressed="false"
              >
                <span class="diet-icon" data-icon="underline" data-size="20" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="strike"
                aria-label="{{strikethroughLabel}}"
                aria-pressed="false"
              >
                <span class="diet-icon" data-icon="strikethrough" data-size="20" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="link"
                aria-label="{{linkLabel}}"
                aria-pressed="false"
                disabled
              >
                <span class="diet-icon" data-icon="link" data-size="20" aria-hidden="true"></span>
              </button>
            </div>
            <span class="diet-dropdown-edit__divider"></span>
            <div class="diet-dropdown-edit__group diet-dropdown-edit__group--clear">
              <button
                type="button"
                class="diet-button"
                data-size="medium"
                data-type="quaternary"
                data-command="clear-format"
                aria-label="{{clearFormattingLabel}}"
                disabled
              >
                <span class="diet-icon" data-icon="arrow.counterclockwise" data-size="20" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <div class="diet-dropdown-edit__linksheet" aria-hidden="true">
            <div class="diet-dropdown-edit__link-header">
              <span class="diet-dropdown-edit__link-header-label">{{linkLabel}}</span>
              <button
                type="button"
                class="diet-button diet-dropdown-edit__link-close"
                data-size="medium"
                data-type="quaternary"
                aria-label="{{closeLinkLabel}}"
              >
                <span class="diet-icon" data-icon="multiply" aria-hidden="true"></span>
              </button>
            </div>
            <div class="diet-dropdown-edit__link-body">
              <div class="diet-textfield" data-size="md">
                <label class="diet-textfield__control">
                  <span class="diet-textfield__display-label label-s">{{urlLabel}}</span>
                  <input
                    type="text"
                    class="diet-textfield__field body-s diet-dropdown-edit__link-input"
                    aria-label="{{urlLabel}}"
                    placeholder="https://example.com"
                  />
                </label>
              </div>
              <div class="diet-dropdown-edit__link-actions">
                <button
                  type="button"
                  class="diet-button diet-dropdown-edit__link-action"
                  data-size="medium"
                  data-type="primary"
                  data-add-label="{{addLinkLabel}}"
                  data-remove-label="{{removeLinkLabel}}"
                >
                  <span class="diet-button__label">{{addLinkLabel}}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <input id="{{id}}" type="hidden" class="diet-dropdown-edit__field" value="{{placeholder}}"{{#if path}} data-path="{{path}}"{{/if}} />
</div>
