<div
  class="diet-object-manager"
  data-size="md"
  data-label-path="{{labelPath}}"
  data-index-token="{{indexToken}}"
  {{#if min}} data-min-items="{{min}}"{{/if}}
  {{#if defaultItem}} data-default-item="{{defaultItem}}"{{/if}}
>
  <div class="diet-object-manager__list" data-objects-list></div>

  <div class="diet-object-manager__footer">
    <button class="diet-button" type="button" data-size="medium" data-type="secondary" data-objects-add>
      <span class="diet-button__label">{{addLabel}}</span>
    </button>
    <button class="diet-button" type="button" data-size="medium" data-type="secondary" data-objects-manage hidden>
      <span class="diet-button__label">{{reorderLabel}}</span>
    </button>
  </div>

  <input
    type="hidden"
    class="diet-object-manager__field"
    value="[]"
    {{#if path}} data-bob-path="{{path}}"{{/if}}
    data-dieter-json
  />

  <template data-objects-item>{{template}}</template>

  <dialog class="diet-popup" data-size="medium" aria-label="{{reorderTitle}}" data-objects-modal>
    <div class="diet-object-manager__editor" data-objects-editor>
      <header class="diet-popup__header">
        <h2 class="diet-object-manager__title heading-5">{{reorderTitle}}</h2>
      </header>
      <div class="diet-popup__body">
        <div class="diet-object-manager__modal-list" data-objects-modal-list></div>
      </div>
      <footer class="diet-popup__footer">
        <div class="diet-popup__actions">
          <button type="button" class="diet-button" data-size="medium" data-type="secondary" data-objects-cancel>
            <span class="diet-button__label">Cancel</span>
          </button>
          <button type="button" class="diet-button" data-size="medium" data-type="primary" data-objects-save>
            <span class="diet-button__label">Save</span>
          </button>
        </div>
      </footer>
    </div>
    <div class="diet-object-manager__editor" data-objects-discard-panel hidden>
      <header class="diet-popup__header">
        <h2 class="diet-object-manager__title heading-5">Discard changes?</h2>
      </header>
      <div class="diet-popup__body">
        <p class="diet-object-manager__modal-message body-m">Your reorder and delete changes have not been saved.</p>
      </div>
      <footer class="diet-popup__footer">
        <div class="diet-popup__actions">
          <button type="button" class="diet-button" data-size="medium" data-type="secondary" data-objects-keep-editing>
            <span class="diet-button__label">Keep editing</span>
          </button>
          <button type="button" class="diet-button" data-size="medium" data-type="primary" data-objects-discard>
            <span class="diet-button__label">Discard</span>
          </button>
        </div>
      </footer>
    </div>
  </dialog>

  <template data-objects-row>
    <div class="diet-object-manager__modal-row">
      <div class="diet-object-manager__modal-label label-m" data-objects-label></div>
      <div class="diet-object-manager__modal-controls">
        <button type="button" class="diet-button diet-tooltip" data-size="small" data-type="quaternary" aria-label="Move object up" data-tooltip="Move object up" data-tooltip-placement="top" data-objects-up>
          <span class="diet-icon" aria-hidden="true" data-icon="chevron.up" data-size="12"></span>
        </button>
        <button type="button" class="diet-button diet-tooltip" data-size="small" data-type="quaternary" aria-label="Move object down" data-tooltip="Move object down" data-tooltip-placement="top" data-objects-down>
          <span class="diet-icon" aria-hidden="true" data-icon="chevron.down" data-size="12"></span>
        </button>
        <button type="button" class="diet-button diet-tooltip" data-size="small" data-type="quaternary" aria-label="Delete object" data-tooltip="Delete object" data-tooltip-placement="top" data-objects-delete>
          <span class="diet-icon" aria-hidden="true" data-icon="trash" data-size="12"></span>
        </button>
      </div>
    </div>
  </template>
</div>
