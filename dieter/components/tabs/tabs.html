<div class="diet-tabs{{#if block}} diet-tabs--block{{/if}}" data-size="{{size}}" role="radiogroup" aria-label="{{ariaLabel}}">
  <input class="diet-tab__input sr-only" type="radio" id="{{tab1Id}}" name="{{groupName}}"{{tab1CheckedAttr}}{{#if tab1Disabled}} disabled{{/if}} />
  <label class="diet-tab" for="{{tab1Id}}">
    <span class="diet-tab__label">{{tab1Label}}</span>
  </label>
  {{#if tab2Id}}
  <input class="diet-tab__input sr-only" type="radio" id="{{tab2Id}}" name="{{groupName}}"{{tab2CheckedAttr}}{{#if tab2Disabled}} disabled{{/if}} />
  <label class="diet-tab" for="{{tab2Id}}">
    <span class="diet-tab__label">{{tab2Label}}</span>
  </label>
  {{/if}}
  {{#if tab3Id}}
  <input class="diet-tab__input sr-only" type="radio" id="{{tab3Id}}" name="{{groupName}}"{{tab3CheckedAttr}}{{#if tab3Disabled}} disabled{{/if}} />
  <label class="diet-tab" for="{{tab3Id}}">
    <span class="diet-tab__label">{{tab3Label}}</span>
  </label>
  {{/if}}
</div>
