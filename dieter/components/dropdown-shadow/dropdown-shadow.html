<div
  class="diet-dropdown-shadow diet-popover-host"
  data-size="{{size}}"
  data-state="{{state}}"
  data-axis="{{axis}}"
>
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-shadow__value-field"
    value='{{value}}'
    {{#if path}}data-path="{{path}}"{{/if}}
    data-dieter-json
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-shadow__control"
    aria-haspopup="dialog"
    aria-expanded="{{expanded}}"
    aria-labelledby="{{id}}-label"
  >
    <span class="diet-dropdown-header-label" id="{{id}}-label">{{label}}</span>
    <span class="diet-dropdown-header-value" data-muted="true">
      <span class="diet-dropdown-shadow__label"></span>
      <span class="diet-dropdown-shadow__chip" aria-hidden="true" hidden></span>
      <span class="diet-icon diet-dropdown-shadow__none-icon" data-icon="square.slash" aria-hidden="true"></span>
    </span>
  </button>

  <div
    class="diet-popover diet-dropdown-shadow__popover"
    data-width="{{popoverWidth}}"
    role="dialog"
    aria-labelledby="{{id}}-label"
    data-state="{{state}}"
  >
    <div class="diet-popover__header">
      <span class="diet-popover__header-label">{{label}}</span>
    </div>
    <div class="diet-popover__body">
      <div class="diet-dropdown-shadow__panel">
        <label class="diet-toggle diet-toggle--block" data-size="{{size}}">
          <span class="diet-toggle__label" id="{{id}}-enabled-label">{{enabledLabel}}</span>
          <input
            id="{{id}}-enabled"
            class="diet-toggle__input sr-only diet-dropdown-shadow__enabled"
            type="checkbox"
            role="switch"
            aria-labelledby="{{id}}-enabled-label"
          />
          <span class="diet-toggle__switch" aria-hidden="true">
            <span class="diet-toggle__knob"></span>
          </span>
        </label>

        <div class="diet-dropdown-shadow__dependent-controls">
          <div class="diet-dropdown-shadow__preview" role="img" aria-label="{{previewLabel}}">
            <div class="diet-dropdown-shadow__shadow-preview"></div>
          </div>

          <div class="diet-dropdown-shadow__geometry">
            <div class="diet-slider diet-dropdown-shadow__slider diet-dropdown-shadow__axis-control diet-dropdown-shadow__axis-control--x" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-x">{{horizontalLabel}}</label>
              <input id="{{id}}-x" class="diet-slider__input diet-dropdown-shadow__x" type="range" min="-50" max="50" value="0" />
              <span class="diet-dropdown-shadow__slider-value diet-dropdown-shadow__x-value" aria-hidden="true">0px</span>
            </div>
            <div class="diet-slider diet-dropdown-shadow__slider diet-dropdown-shadow__axis-control diet-dropdown-shadow__axis-control--y" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-y">{{verticalLabel}}</label>
              <input id="{{id}}-y" class="diet-slider__input diet-dropdown-shadow__y" type="range" min="-50" max="50" value="0" />
              <span class="diet-dropdown-shadow__slider-value diet-dropdown-shadow__y-value" aria-hidden="true">0px</span>
            </div>
            <div class="diet-slider diet-dropdown-shadow__slider" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-blur">{{blurLabel}}</label>
              <input id="{{id}}-blur" class="diet-slider__input diet-dropdown-shadow__blur" type="range" min="0" max="120" value="0" />
              <span class="diet-dropdown-shadow__slider-value diet-dropdown-shadow__blur-value" aria-hidden="true">0px</span>
            </div>
            <div class="diet-slider diet-dropdown-shadow__slider" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-spread">{{spreadLabel}}</label>
              <input id="{{id}}-spread" class="diet-slider__input diet-dropdown-shadow__spread" type="range" min="-40" max="40" value="0" />
              <span class="diet-dropdown-shadow__slider-value diet-dropdown-shadow__spread-value" aria-hidden="true">0px</span>
            </div>
            <div class="diet-slider diet-dropdown-shadow__slider" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-opacity">{{opacityLabel}}</label>
              <input id="{{id}}-opacity" class="diet-slider__input diet-dropdown-shadow__opacity" type="range" min="0" max="100" value="0" />
              <span class="diet-dropdown-shadow__slider-value diet-dropdown-shadow__opacity-value" aria-hidden="true">0%</span>
            </div>
          </div>

          <div class="diet-dropdown-shadow__color-editor">
            <div class="diet-dropdown-shadow__color-label">{{colorLabel}}</div>
            <div class="diet-dropdown-shadow__sv" data-role="sv">
              <div class="diet-dropdown-shadow__sv-canvas">
                <div class="diet-dropdown-shadow__sv-thumb" aria-hidden="true"></div>
              </div>
            </div>
            <div class="diet-slider diet-dropdown-shadow__slider diet-dropdown-shadow__slider--hue" data-size="{{size}}">
              <label class="diet-slider__label" for="{{id}}-hue">{{hueLabel}}</label>
              <input id="{{id}}-hue" type="range" min="0" max="360" step="1" class="diet-slider__input diet-dropdown-shadow__hue" />
            </div>
            <div class="diet-textfield" data-size="{{size}}" data-role="hex">
              <label class="diet-textfield__control">
                <span class="diet-textfield__display-label">{{hexLabel}}</span>
                <input type="text" class="diet-textfield__field diet-dropdown-shadow__hex" aria-label="{{hexLabel}}" placeholder="RRGGBB" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="6" pattern="^[0-9a-fA-F]{0,6}$" />
              </label>
            </div>
            <div class="diet-dropdown-shadow__swatches" role="group" aria-label="{{defaultColorsLabel}}">
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#ff3b30" aria-label="{{colorLabel}} #ff3b30" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#ff9500" aria-label="{{colorLabel}} #ff9500" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#ffcc00" aria-label="{{colorLabel}} #ffcc00" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#34c759" aria-label="{{colorLabel}} #34c759" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#30b0c7" aria-label="{{colorLabel}} #30b0c7" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#007aff" aria-label="{{colorLabel}} #007aff" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#32ade6" aria-label="{{colorLabel}} #32ade6" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#00c7be" aria-label="{{colorLabel}} #00c7be" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#5856d6" aria-label="{{colorLabel}} #5856d6" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#af52de" aria-label="{{colorLabel}} #af52de" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#ff2d55" aria-label="{{colorLabel}} #ff2d55" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#a2845e" aria-label="{{colorLabel}} #a2845e" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#212121" aria-label="{{colorLabel}} #212121" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#aeaeb2" aria-label="{{colorLabel}} #aeaeb2" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#c7c7cc" aria-label="{{colorLabel}} #c7c7cc" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#d1d1d6" aria-label="{{colorLabel}} #d1d1d6" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#e5e5ea" aria-label="{{colorLabel}} #e5e5ea" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
              <button type="button" class="diet-dropdown-shadow__swatch" data-color="#ffffff" aria-label="{{colorLabel}} #ffffff" aria-pressed="false"><span class="diet-dropdown-shadow__swatch-dot" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
