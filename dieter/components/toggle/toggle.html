<label class="diet-toggle diet-toggle--block" data-size="{{size}}">
  <span class="diet-toggle__label" id="{{id}}-label">{{label}}</span>
  <input id="{{id}}" class="diet-toggle__input sr-only" type="checkbox" role="switch" aria-labelledby="{{id}}-label"{{#if path}} data-path="{{path}}"{{/if}}{{checkedAttr}}{{#if disabled}} disabled{{/if}} />
  <span class="diet-toggle__switch" aria-hidden="true">
    <span class="diet-toggle__knob"></span>
  </span>
</label>
