<div
  class="diet-dropdown-upload diet-popover-host"
  data-size="{{size}}"
  data-state="{{state}}"
  data-has-file="false"
  data-copy-upload-asset-error="{{uploadAssetErrorLabel}}"
  data-copy-preview-asset-error="{{previewAssetErrorLabel}}"
>
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-upload__value-field"
    value='{{value}}'
    {{#if path}}data-path="{{path}}"{{/if}}
    data-dieter-json
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-upload__control"
    aria-haspopup="dialog"
    aria-expanded="{{expanded}}"
    aria-labelledby="{{id}}-label"
  >
    <span class="diet-dropdown-header-label {{labelClass}}" id="{{id}}-label">{{label}}</span>
    <span class="diet-dropdown-header-value {{bodyClass}}" data-muted="true">
      <span class="diet-dropdown-upload__label" data-placeholder="{{placeholder}}">{{placeholder}}</span>
    </span>
  </button>

  <div
    class="diet-popover diet-dropdown-upload__popover"
    data-width="row"
    role="dialog"
    aria-labelledby="{{id}}-popover-label"
    data-state="{{state}}"
  >
    <div class="diet-popover__header">
      <span class="diet-popover__header-label" id="{{id}}-popover-label">{{label}}</span>
    </div>

    <div class="diet-popover__body">
      <div class="diet-dropdown-upload__panel" data-has-file="false" data-kind="empty">
        <div class="diet-dropdown-upload__preview-frame">
          <img class="diet-dropdown-upload__preview-img" alt="" />
          <video
            class="diet-dropdown-upload__preview-video"
            muted
            playsinline
            preload="metadata"
          ></video>
          <div class="diet-dropdown-upload__preview-doc" aria-hidden="true">
            <span class="diet-icon" data-icon="document"></span>
            <span class="diet-dropdown-upload__preview-ext"></span>
          </div>
          <span
            class="diet-icon diet-dropdown-upload__preview-empty"
            data-icon="photo"
            aria-hidden="true"
          ></span>
        </div>

        <div class="diet-dropdown-upload__selected" hidden>
          <span class="diet-dropdown-upload__preview-name" role="status"></span>
        </div>
        <div class="diet-dropdown-upload__preview-error" role="alert" hidden></div>

        <div class="diet-dropdown-upload__actions">
          <button
            type="button"
            class="diet-button diet-dropdown-upload__upload-btn"
            data-size="{{buttonSize}}"
            data-type="tertiary"
          >
            <span class="diet-button__label">{{uploadLabel}}</span>
          </button>
          <div class="diet-dropdown-upload__file-actions" hidden>
            <button
              type="button"
              class="diet-button diet-dropdown-upload__replace-btn"
              data-size="{{buttonSize}}"
              data-type="tertiary"
            >
              <span class="diet-button__label">{{replaceLabel}}</span>
            </button>
            <button
              type="button"
              class="diet-button diet-dropdown-upload__remove-btn"
              data-size="{{buttonSize}}"
              data-type="quaternary"
            >
              <span class="diet-button__label">{{removeLabel}}</span>
            </button>
          </div>
        </div>

        <input
          type="file"
          class="diet-dropdown-upload__file-input"
          {{#if accept}}accept="{{accept}}"{{/if}}
          hidden
        />
      </div>
    </div>
  </div>
</div>
