<div class="diet-dropdown-upload diet-popover-host" data-size="{{size}}" data-state="closed" data-has-file="false">
  <input
    id="{{id}}"
    type="hidden"
    class="diet-dropdown-upload__value-field"
    value="{{value}}"
    {{#if path}}data-path="{{path}}"{{/if}}
    data-placeholder="{{placeholder}}"
    data-accept="{{accept}}"
    data-max-image-kb="{{maxImageKb}}"
    data-max-video-kb="{{maxVideoKb}}"
    data-max-other-kb="{{maxOtherKb}}"
  />
  <input
    type="hidden"
    class="diet-dropdown-upload__meta-field"
    value=""
    {{#if metaPath}}data-bob-path="{{metaPath}}"{{/if}}
    data-bob-json
  />

  <button
    type="button"
    class="diet-dropdown-header diet-dropdown-upload__control"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-labelledby="{{id}}-label"
  >
    <span class="diet-dropdown-upload__header-icon" aria-hidden="true"></span>
    <span class="diet-dropdown-header-label {{labelClass}}" id="{{id}}-label">
      {{#if label}}{{label}}{{else}}{{placeholder}}{{/if}}
    </span>
    <span class="diet-dropdown-header-value {{bodyClass}}" data-muted="true" data-placeholder="{{placeholder}}">
      <span class="diet-dropdown-upload__label">{{placeholder}}</span>
    </span>
  </button>

  <div class="diet-popover diet-dropdown-upload__popover" role="dialog" aria-label="{{popoverLabel}}" data-state="closed">
    <div class="diet-popover__header">
      <span class="diet-popover__header-label {{#if headerLabelClass}}{{headerLabelClass}}{{else}}label-s{{/if}}">
        {{#if headerLabel}}{{headerLabel}}{{else}}{{label}}{{/if}}
      </span>
      <button
        type="button"
        class="diet-button diet-popover__header-trigger"
        data-size="small"
        data-type="secondary"
        aria-hidden="true"
        tabindex="-1"
      >
        <span class="diet-icon" data-icon="paintbrush" data-size="12"></span>
      </button>
    </div>

    <div class="diet-popover__body">
      <div class="diet-dropdown-upload__panel body-xs" data-has-file="false" data-kind="empty">
        <div class="diet-dropdown-upload__preview">
          <div class="diet-dropdown-upload__preview-frame" aria-hidden="true">
            <img class="diet-dropdown-upload__preview-img" data-role="img" alt="" />
            <div class="diet-dropdown-upload__preview-video" data-role="video">
              <video
                class="diet-dropdown-upload__preview-video-el"
                data-role="videoEl"
                muted
                playsinline
                preload="metadata"
              ></video>
              <div class="diet-dropdown-upload__preview-video-badge label-s">Video</div>
            </div>
            <div class="diet-dropdown-upload__preview-doc" data-role="doc">
              <span class="diet-icon diet-dropdown-upload__preview-doc-icon" data-icon="document" aria-hidden="true"></span>
              <div class="diet-dropdown-upload__preview-doc-ext label-s" data-role="ext"></div>
            </div>
            <div class="diet-dropdown-upload__preview-empty" data-role="empty">
              <span class="diet-dropdown-upload__preview-empty-icon" data-icon="photo" aria-hidden="true"></span>
            </div>
          </div>
          <div class="diet-dropdown-upload__preview-meta">
            <div class="diet-dropdown-upload__preview-name label-s" data-role="name" role="status"></div>
            <div class="diet-dropdown-upload__preview-error label-xs" data-role="error" role="alert"></div>
          </div>
        </div>

        <div class="diet-dropdown-upload__actions">
          <button type="button" class="diet-button diet-dropdown-upload__upload-btn" data-size="large" data-type="secondary">
            <span class="diet-button__label">Upload</span>
          </button>
          <div class="diet-dropdown-upload__file-controls">
            <button type="button" class="diet-button diet-dropdown-upload__replace-btn" data-size="large" data-type="secondary">
              <span class="diet-button__label">Upload new file</span>
            </button>
            <button type="button" class="diet-button diet-dropdown-upload__remove-btn" data-size="large" data-type="destructive">
              <span class="diet-button__label">Remove</span>
            </button>
          </div>
        </div>

        <input type="file" class="diet-dropdown-upload__file-input" accept="{{accept}}" aria-hidden="true" tabindex="-1" />

        {{#if template}}
          <div class="diet-dropdown-upload__extras">
            {{template}}
          </div>
        {{/if}}
      </div>
    </div>
  </div>
</div>
