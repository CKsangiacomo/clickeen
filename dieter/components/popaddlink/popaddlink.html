<div class="diet-popaddlink diet-popover">
  <div class="diet-popover__header">
    <button class="diet-btn-menuactions diet-popaddlink__close" data-size="sm" type="button">
      <span class="diet-btn-menuactions__label">
        {{#if headerLabel}}{{headerLabel}}{{else}}Add URL{{/if}}
      </span>
      <span class="diet-icon" data-icon="multiply" aria-hidden="true"></span>
    </button>
  </div>
  <div class="diet-popover__body">
    <div class="diet-textfield" data-size="md">
      <label class="diet-textfield__control">
        <span class="diet-textfield__display-label {{#if fieldLabelClass}}{{fieldLabelClass}}{{else}}label-s{{/if}}">URL</span>
        <input
          type="text"
          class="diet-textfield__field {{#if bodyClass}}{{bodyClass}}{{else}}body-s{{/if}} diet-popaddlink__input"
          aria-label="URL"
          placeholder="https://example.com"
        />
      </label>
      <span class="diet-textfield__helper caption diet-popaddlink__helper"></span>
    </div>
    <div class="diet-popaddlink__actions">
      <button
        type="button"
        class="diet-button diet-popaddlink__apply"
        data-size="medium"
        data-type="primary"
      >
        <span class="diet-button__label">Apply</span>
      </button>
    </div>
  </div>
</div>
