<style>
  .entitlements-section {
    display: grid;
    gap: var(--space-4);
  }

  .entitlements-section > h2 {
    margin: 0;
  }

  .entitlements-table {
    table-layout: fixed;
  }

  .entitlements-table__tier {
    width: 96px;
  }

  .entitlements-table__name-col {
    width: 180px;
  }

  .entitlements-table__token-col {
    width: 200px;
  }

  .entitlements-table__desc-col {
    width: 320px;
  }

  .entitlements-table thead th.entitlements-table__tier-head {
    text-align: right;
  }

  .entitlements-tier-label {
    display: block;
    width: 100%;
    text-align: right !important;
  }

  .entitlements-table th {
    white-space: nowrap;
  }

  .entitlements-table__token {
    white-space: nowrap;
  }

  .entitlements-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-block-size: var(--control-size-md);
    width: 100%;
  }

  .entitlements-cell--flag {
    justify-content: flex-end;
  }

  .entitlements-cell--flag .diet-toggle {
    justify-content: flex-end;
    padding-inline: 0;
    gap: 0;
  }

  .entitlements-valuefield {
    width: 100%;
  }

  .entitlements-valuefield .diet-valuefield__control {
    padding-inline: 0;
    gap: 0;
  }

  .entitlements-valuefield .diet-valuefield__input {
    width: 100%;
  }

  .entitlements-valuefield.diet-valuefield
    > .diet-valuefield__control
    .diet-valuefield__field {
    field-sizing: fixed;
    inline-size: 100%;
    text-align: right;
  }

  .entitlements-valuefield.is-editing .diet-valuefield__field {
    color: var(--color-text);
  }

  .entitlements-valuefield.entitlements-val--nonzero:not(.is-editing) .diet-valuefield__field {
    color: var(--color-system-green-contrast);
  }

  .entitlements-valuefield.entitlements-val--zero:not(.is-editing) .diet-valuefield__field {
    color: color-mix(in oklab, var(--color-text), transparent 20%);
  }

  .entitlements-valuefield.entitlements-val--inf:not(.is-editing) .diet-valuefield__field::placeholder {
    color: var(--color-system-blue);
    opacity: 1;
  }

  .entitlements-bytes {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
  }

  .entitlements-unit {
    min-block-size: var(--control-size-md);
    padding-inline: var(--control-padding-inline);
    border-radius: var(--control-radius-md);
    border: 1px solid color-mix(in oklab, var(--role-border), transparent 10%);
    background: var(--role-surface);
    color: var(--color-text);
    cursor: pointer;
  }

  .entitlements-unit:focus-visible {
    outline: 2px solid var(--focus-ring-color, var(--color-system-blue));
    outline-offset: 2px;
  }

  .entitlements-table__desc {
    color: color-mix(in oklab, var(--color-text), transparent 35%);
  }

  .entitlements-table__desc-stack {
    display: grid;
    gap: var(--space-1);
  }

  .entitlements-table__enforcement {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
  }

  .entitlements-table__badge {
    display: inline-flex;
    align-items: center;
    min-block-size: var(--control-size-sm);
    padding-inline: var(--control-inline-gap-md);
    border-radius: var(--control-radius-sm);
    color: var(--color-system-green-contrast);
    background: color-mix(in oklab, var(--color-system-green), transparent 84%);
  }

  .entitlements-table__badge[data-status='gap'] {
    color: var(--color-system-orange-contrast);
    background: color-mix(in oklab, var(--color-system-orange), transparent 84%);
  }

  .entitlements-table__owner {
    color: color-mix(in oklab, var(--color-text), transparent 45%);
  }

  .entitlements-ai__hint {
    margin-top: var(--space-1);
    color: color-mix(in oklab, var(--color-text), transparent 40%);
  }

  tr.entitlements-ai-row--model td:first-child {
    color: color-mix(in oklab, var(--color-text), transparent 10%);
  }

  .entitlements-ai-row__model-label {
    display: block;
    color: var(--color-text);
    margin-block-end: 2px;
  }

  .entitlements-agent-row__name--provider {
    padding-left: var(--space-4);
  }

</style>

<h1 class="heading-2">Policy Editor</h1>

<div data-page-actions></div>
<section id="entitlements-root" aria-live="polite"></section>

<script type="module">
  const root = document.getElementById('entitlements-root');
  const meta = window.__CK_ENTITLEMENTS_META__ || {};
  const aiAccess = window.__CK_AI_ACCESS__ || null;
  const aiProviders = Array.isArray(aiAccess?.providers) ? aiAccess.providers : [];
  const aiModels = Array.isArray(aiAccess?.models) ? aiAccess.models : [];
  const aiAgents = Array.isArray(aiAccess?.agents) ? aiAccess.agents : [];
  const aiCopilots = Array.isArray(aiAccess?.copilots) ? aiAccess.copilots : aiAgents.filter((agent) => agent?.category === 'copilot');
  const aiSystemAgents = Array.isArray(aiAccess?.systemAgents) ? aiAccess.systemAgents : aiAgents.filter((agent) => agent?.category === 'system_agent');

  const POLICY_COPY = Object.freeze({
    saved: 'Policy changes saved.',
    loadFailed: 'Policy data could not be loaded. Try again.',
    entitlementSaveFailed: 'Entitlement changes could not be saved. Try again.',
    aiSaveFailed: 'AI policy changes could not be saved. Try again.',
    entitlementSavedUnreadable: 'Entitlement changes were saved, but the latest policy could not be shown. Reload policy data.',
    aiSavedUnreadable: 'AI policy changes were saved, but the latest policy could not be shown. Reload policy data.',
  });

  function appendTable(section, table) {
    const frame = document.createElement('div');
    frame.className = 'diet-table';
    table.classList.add('diet-table__table');
    frame.appendChild(table);
    section.appendChild(frame);
  }

  const state = {
    matrix: null,
    matrixPath: null,
    aiRuntimeMatrix: null,
    aiRuntimePath: null,
    busy: true,
    reloading: false,
    pendingControl: null,
    feedback: { kind: 'loading' },
    lastSavedAt: null,
    filter: '',
    unitsByEntitlementKey: {},
  };

  const setStatus = (next) => {
    Object.assign(state, next);
    render();
  };

  const entitlementControlKey = (entitlementKey, tier) => `entitlement:${entitlementKey}:${tier}`;
  const aiControlKey = (payload) => [
    'ai',
    payload.agentId,
    payload.tier,
    payload.field,
    payload.provider || '',
    payload.model || '',
  ].join(':');

  function appendPendingControlState(container, control, key) {
    if (state.pendingControl !== key) return;
    control.setAttribute('aria-busy', 'true');
    const spinner = document.createElement('span');
    spinner.className = 'diet-spinner';
    spinner.setAttribute('data-size', 'small');
    spinner.setAttribute('aria-hidden', 'true');
    container.appendChild(spinner);
  }

  const isRecord = (value) => Boolean(value) && typeof value === 'object' && !Array.isArray(value);
  const isUsableEntitlementMatrix = (value) => isRecord(value) && Array.isArray(value.tiers) && isRecord(value.entitlements);
  const isUsableAiRuntimeMatrix = (value) => isRecord(value) && isRecord(value.agents);

  async function fetchMatrix() {
    const res = await fetch('/api/entitlements/matrix', {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
    });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.ok || !isUsableEntitlementMatrix(json.matrix)) throw new Error('POLICY_READ_FAILED');
    return { matrix: json.matrix, path: json.path || null };
  }

  async function saveCell({ entitlementKey, tier, value }) {
    if (state.busy) return;
    const pendingControl = entitlementControlKey(entitlementKey, tier);
    setStatus({ busy: true, pendingControl, feedback: null });
    try {
      const res = await fetch('/api/entitlements/matrix/cell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entitlementKey, tier, value }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok) throw new Error('ENTITLEMENT_SAVE_FAILED');
      const savedAt = new Date();
      if (!json?.ok || !isUsableEntitlementMatrix(json.matrix)) {
        setStatus({
          busy: false,
          pendingControl: null,
          lastSavedAt: savedAt,
          feedback: { kind: 'alert', message: POLICY_COPY.entitlementSavedUnreadable },
        });
        return;
      }
      setStatus({
        matrix: json.matrix,
        matrixPath: json.path || state.matrixPath,
        busy: false,
        pendingControl: null,
        lastSavedAt: savedAt,
        feedback: { kind: 'status', message: POLICY_COPY.saved },
      });
    } catch (_err) {
      setStatus({ busy: false, pendingControl: null, feedback: { kind: 'alert', message: POLICY_COPY.entitlementSaveFailed } });
      throw new Error('ENTITLEMENT_SAVE_FAILED');
    }
  }

  async function fetchAiRuntimeMatrix() {
    const res = await fetch('/api/ai-runtime/matrix', {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
    });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json?.ok || !isUsableAiRuntimeMatrix(json.matrix)) throw new Error('POLICY_READ_FAILED');
    return { matrix: json.matrix, path: json.path || null };
  }

  async function saveAiRuntimeCell(payload) {
    if (state.busy) return;
    const pendingControl = aiControlKey(payload);
    setStatus({ busy: true, pendingControl, feedback: null });
    try {
      const res = await fetch('/api/ai-runtime/matrix/cell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok) throw new Error('AI_POLICY_SAVE_FAILED');
      const savedAt = new Date();
      if (!json?.ok || !isUsableAiRuntimeMatrix(json.matrix)) {
        setStatus({
          busy: false,
          pendingControl: null,
          lastSavedAt: savedAt,
          feedback: { kind: 'alert', message: POLICY_COPY.aiSavedUnreadable },
        });
        return;
      }
      setStatus({
        aiRuntimeMatrix: json.matrix,
        aiRuntimePath: json.path || state.aiRuntimePath,
        busy: false,
        pendingControl: null,
        lastSavedAt: savedAt,
        feedback: { kind: 'status', message: POLICY_COPY.saved },
      });
    } catch (_err) {
      setStatus({ busy: false, pendingControl: null, feedback: { kind: 'alert', message: POLICY_COPY.aiSaveFailed } });
      throw new Error('AI_POLICY_SAVE_FAILED');
    }
  }

  const formatBytes = (bytes) => {
    if (!Number.isFinite(bytes) || bytes < 0) return String(bytes);
    const gb = 1024 * 1024 * 1024;
    const mb = 1024 * 1024;
    if (bytes >= gb) return `${Math.round(bytes / gb)}GB`;
    if (bytes >= mb) return `${Math.round(bytes / mb)}MB`;
    if (bytes >= 1024) return `${Math.round(bytes / 1024)}KB`;
    return `${bytes}B`;
  };

  const formatValue = ({ key, entitlement, value }) => {
    if (value === null) return '∞';
    if (entitlement.kind === 'flag') return value ? '✓' : '✗';
    if (typeof value === 'number') {
      if (key === 'uploads.size.max' || key === 'storage.bytes.max') return formatBytes(value);
      if (Number.isFinite(value) && Math.abs(value) >= 1000) return value.toLocaleString('en-US');
      return String(value);
    }
    return String(value);
  };

  const numberFormatter = new Intl.NumberFormat('en-US', { maximumFractionDigits: 20 });

  function formatNumberDisplay(value) {
    if (value === null || typeof value === 'undefined') return '';
    if (typeof value !== 'number' || !Number.isFinite(value)) return '';
    return numberFormatter.format(value);
  }

  function parseNumberish(raw) {
    const txt = String(raw ?? '').trim();
    if (!txt) return null;
    const cleaned = txt.replace(/,/g, '');
    const next = Number(cleaned);
    if (!Number.isFinite(next)) return null;
    return next;
  }

  function getByteFactor(unit) {
    return unit === 'kb' ? 1024 : 1024 * 1024;
  }

  function bytesToUnitValue(bytes, unit) {
    if (bytes === null || typeof bytes === 'undefined') return null;
    if (typeof bytes !== 'number' || !Number.isFinite(bytes)) return null;
    return bytes / getByteFactor(unit);
  }

  function unitValueToBytes(value, unit) {
    if (value === null || typeof value === 'undefined') return null;
    if (typeof value !== 'number' || !Number.isFinite(value)) return null;
    return Math.round(value * getByteFactor(unit));
  }

  function renderToolbar() {
    const actions = document.querySelector('[data-page-actions]');
    if (!actions) return;
    const reloadBtn = document.createElement('button');
    reloadBtn.className = 'diet-button';
    reloadBtn.setAttribute('data-size', 'md');
    reloadBtn.setAttribute('data-variant', 'secondary');
    reloadBtn.type = 'button';
    if (state.reloading) {
      reloadBtn.dataset.loading = 'true';
      reloadBtn.setAttribute('aria-busy', 'true');
      const spinner = document.createElement('span');
      spinner.className = 'diet-spinner';
      spinner.setAttribute('aria-hidden', 'true');
      reloadBtn.appendChild(spinner);
    }
    const reloadLabel = document.createElement('span');
    reloadLabel.className = 'diet-button__label';
    reloadLabel.textContent = 'Reload';
    reloadBtn.appendChild(reloadLabel);
    reloadBtn.disabled = state.busy;
    reloadBtn.addEventListener('click', async () => {
      if (state.busy) return;
      setStatus({ busy: true, reloading: true, feedback: null });
      try {
        const [next, nextAiRuntime] = await Promise.all([fetchMatrix(), fetchAiRuntimeMatrix()]);
        setStatus({
          matrix: next.matrix,
          matrixPath: next.path,
          aiRuntimeMatrix: nextAiRuntime.matrix,
          aiRuntimePath: nextAiRuntime.path,
          busy: false,
          reloading: false,
          feedback: null,
        });
      } catch (_err) {
        setStatus({ busy: false, reloading: false, feedback: { kind: 'alert', message: POLICY_COPY.loadFailed } });
      }
    });

    actions.replaceChildren(reloadBtn);
  }

  function createEditableValueCell({ key, entitlement, tier }) {
    const td = document.createElement('td');
    td.className = 'body-s entitlements-table__value';

    const value = entitlement.values?.[tier];
    const disabled = state.busy;

    const safeId = `ent_${String(key)}_${String(tier)}`.replace(/[^a-zA-Z0-9_-]+/g, '_');
    const pendingKey = entitlementControlKey(key, tier);

    const cell = document.createElement('div');
    cell.className = `entitlements-cell entitlements-cell--${entitlement.kind}`;
    td.appendChild(cell);

    if (entitlement.kind === 'flag') {
      const wrapper = document.createElement('label');
      wrapper.className = 'diet-toggle';
      wrapper.setAttribute('data-size', 'md');
      wrapper.innerHTML = `
        <span class="diet-toggle__label sr-only" id="${safeId}-label">Enabled</span>
        <input id="${safeId}" class="diet-toggle__input sr-only" type="checkbox" role="switch" aria-labelledby="${safeId}-label" />
        <span class="diet-toggle__switch" aria-hidden="true">
          <span class="diet-toggle__knob"></span>
        </span>
      `;

      const input = wrapper.querySelector('input');
      if (input) {
        input.checked = Boolean(value);
        input.disabled = disabled;
        input.addEventListener('change', async () => {
          try {
            await saveCell({ entitlementKey: key, tier, value: input.checked });
          } catch (_err) {
            const nextValue = state.matrix?.entitlements?.[key]?.values?.[tier];
            input.checked = Boolean(nextValue);
          }
        });
      }

      cell.classList.add('entitlements-cell--flag');
      cell.appendChild(wrapper);
      if (input) appendPendingControlState(cell, input, pendingKey);
      return td;
    }

    const wrapper = document.createElement('div');
    wrapper.className = 'diet-valuefield entitlements-valuefield';
    wrapper.setAttribute('data-size', 'md');

    const isBytes = key === 'uploads.size.max' || key === 'storage.bytes.max';
    const defaultUnit = 'mb';
    const selectedUnit = (state.unitsByEntitlementKey[key] || defaultUnit).toLowerCase() === 'kb' ? 'kb' : 'mb';
    if (!state.unitsByEntitlementKey[key]) state.unitsByEntitlementKey[key] = selectedUnit;

    const rawNumber = typeof value === 'number' && Number.isFinite(value) ? value : null;
    // Color rules apply to the normalized (unfocused) display only.
    wrapper.classList.remove('entitlements-val--inf', 'entitlements-val--zero', 'entitlements-val--nonzero');
    if (value === null || typeof value === 'undefined') {
      wrapper.classList.add('entitlements-val--inf');
    } else if (rawNumber === 0) {
      wrapper.classList.add('entitlements-val--zero');
    } else if (typeof rawNumber === 'number' && Number.isFinite(rawNumber)) {
      wrapper.classList.add('entitlements-val--nonzero');
    }

    const displayNumber = isBytes ? bytesToUnitValue(rawNumber, selectedUnit) : rawNumber;
    const displayText = displayNumber === null ? '' : formatNumberDisplay(displayNumber);
    const rawText = displayNumber === null ? '' : String(displayNumber);
    wrapper.innerHTML = `
      <label class="diet-valuefield__control">
        <span class="diet-valuefield__label is-hidden">Value</span>
        <span class="diet-valuefield__input">
          <input
            id="${safeId}"
            class="diet-valuefield__field"
            type="text"
            inputmode="numeric"
            aria-label="${String(key)} ${String(tier)}"
            placeholder="∞"
          />
        </span>
      </label>
    `;

    const input = wrapper.querySelector('input');

    const bytesWrap = document.createElement('div');
    bytesWrap.className = 'entitlements-bytes';
    bytesWrap.appendChild(wrapper);

    let unitSelect = null;
    if (isBytes) {
      unitSelect = document.createElement('select');
      unitSelect.className = 'entitlements-unit body-xs';
      unitSelect.setAttribute('aria-label', 'Units');
      unitSelect.innerHTML = `
        <option value="kb">KB</option>
        <option value="mb">MB</option>
      `;
      unitSelect.value = selectedUnit;
      unitSelect.disabled = disabled;
      unitSelect.addEventListener('change', () => {
        const nextUnit = unitSelect.value === 'kb' ? 'kb' : 'mb';
        state.unitsByEntitlementKey[key] = nextUnit;
        // Re-render so the displayed number updates to the new unit.
        render();
      });
      bytesWrap.appendChild(unitSelect);
    }

    if (input) {
      input.disabled = disabled;
      input.value = displayText;

      const setDisplay = (numOrNull) => {
        if (numOrNull === null) {
          input.value = '';
          return;
        }
        input.value = formatNumberDisplay(numOrNull);
      };

      const setRaw = (numOrNull) => {
        if (numOrNull === null) {
          input.value = '';
          return;
        }
        input.value = String(numOrNull);
      };

      input.addEventListener('focus', () => {
        wrapper.classList.add('is-editing');
        // On focus, show raw number (no commas).
        const unit = isBytes ? (state.unitsByEntitlementKey[key] || selectedUnit) : null;
        const currentRaw = state.matrix?.entitlements?.[key]?.values?.[tier];
        const currentNum = typeof currentRaw === 'number' && Number.isFinite(currentRaw) ? currentRaw : null;
        const rawForEdit = isBytes ? bytesToUnitValue(currentNum, unit) : currentNum;
        setRaw(rawForEdit);
      });

      const commit = async () => {
        const raw = String(input.value ?? '');
        const parsed = parseNumberish(raw);
        const unit = isBytes ? (state.unitsByEntitlementKey[key] || selectedUnit) : null;
        const normalized = isBytes ? unitValueToBytes(parsed, unit) : parsed;

        try {
          await saveCell({ entitlementKey: key, tier, value: normalized });
          const savedRaw = state.matrix?.entitlements?.[key]?.values?.[tier];
          const savedNum = typeof savedRaw === 'number' && Number.isFinite(savedRaw) ? savedRaw : null;
          const savedDisplay = isBytes ? bytesToUnitValue(savedNum, unit) : savedNum;
          setDisplay(savedDisplay);
        } catch (_err) {
          const current = state.matrix?.entitlements?.[key]?.values?.[tier];
          const currentNum = typeof current === 'number' && Number.isFinite(current) ? current : null;
          const currentDisplay = isBytes ? bytesToUnitValue(currentNum, unit) : currentNum;
          setDisplay(currentDisplay);
        }
      };

      input.addEventListener('blur', () => {
        wrapper.classList.remove('is-editing');
        commit();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          const unit = isBytes ? (state.unitsByEntitlementKey[key] || selectedUnit) : null;
          const current = parseNumberish(input.value);
          const baseStep = isBytes ? 1 : 10;
          const step = e.shiftKey ? baseStep * 10 : baseStep;
          const next = (current ?? 0) + (e.key === 'ArrowUp' ? step : -step);
          setRaw(next);
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          const unit = isBytes ? (state.unitsByEntitlementKey[key] || selectedUnit) : null;
          const current = state.matrix?.entitlements?.[key]?.values?.[tier];
          const currentNum = typeof current === 'number' && Number.isFinite(current) ? current : null;
          const currentDisplay = isBytes ? bytesToUnitValue(currentNum, unit) : currentNum;
          setDisplay(currentDisplay);
          input.blur();
        }
      });
    }

    cell.appendChild(isBytes ? bytesWrap : wrapper);
    if (input) appendPendingControlState(cell, input, pendingKey);
    return td;
  }

  function renderTable({ title, entries, tiers }) {
    const section = document.createElement('section');
    section.className = 'entitlements-section';

    const heading = document.createElement('h2');
    heading.className = 'heading-4';
    heading.textContent = title;
    section.appendChild(heading);

    const table = document.createElement('table');
    table.className = 'body-s entitlements-table';

    const colgroup = document.createElement('colgroup');
    const colEntitlement = document.createElement('col');
    colEntitlement.className = 'entitlements-table__name-col';
    const colDesc = document.createElement('col');
    colDesc.className = 'entitlements-table__desc-col';
    colgroup.append(colEntitlement, colDesc);
    tiers.forEach(() => {
      const col = document.createElement('col');
      col.className = 'entitlements-table__tier';
      colgroup.appendChild(col);
    });
    const colToken = document.createElement('col');
    colToken.className = 'entitlements-table__token-col';
    colgroup.appendChild(colToken);
    table.appendChild(colgroup);

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');

    const entitlementHeader = document.createElement('th');
    entitlementHeader.textContent = 'Entitlement';
    entitlementHeader.className = 'label-s';
    headRow.appendChild(entitlementHeader);

    const descHeader = document.createElement('th');
    descHeader.textContent = 'Description';
    descHeader.className = 'label-s';
    headRow.appendChild(descHeader);

    tiers.forEach((tier) => {
      const th = document.createElement('th');
      th.className = 'label-s entitlements-table__tier-head';

      const label = document.createElement('span');
      label.className = 'label-s entitlements-tier-label';
      label.textContent = tier.replace(/\b\w/g, (c) => c.toUpperCase());
      th.appendChild(label);
      headRow.appendChild(th);
    });

    const tokenHeader = document.createElement('th');
    tokenHeader.textContent = 'Token';
    tokenHeader.className = 'label-s entitlements-table__token-head';
    headRow.appendChild(tokenHeader);

    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    const normalizedFilter = String(state.filter || '').trim().toLowerCase();

    entries
      .filter(({ key, entitlement }) => {
        if (!normalizedFilter) return true;
        const metaEntry = meta[key] || { label: '', description: '', enforcement: null };
        const haystack = [
          String(key || ''),
          String(metaEntry.label || ''),
          String(metaEntry.description || ''),
          String(metaEntry.enforcement?.status || ''),
          String(metaEntry.enforcement?.owner || ''),
          String(metaEntry.enforcement?.note || ''),
          String(entitlement?.kind || ''),
        ]
          .join(' ')
          .toLowerCase();
        return haystack.includes(normalizedFilter);
      })
      .forEach(({ key, entitlement }) => {
      const row = document.createElement('tr');

      const metaEntry = meta[key] || { label: key, description: '', enforcement: null };

      const nameCell = document.createElement('td');
      nameCell.textContent = metaEntry.label || key;
      nameCell.className = 'body-s entitlements-table__name';
      row.appendChild(nameCell);

      const descCell = document.createElement('td');
      descCell.className = 'body-s entitlements-table__desc';
      const descStack = document.createElement('div');
      descStack.className = 'entitlements-table__desc-stack';
      const descText = document.createElement('span');
      descText.textContent = metaEntry.description || '';
      descStack.appendChild(descText);
      if (metaEntry.enforcement) {
        const enforcement = document.createElement('span');
        enforcement.className = 'entitlements-table__enforcement';
        const badge = document.createElement('span');
        badge.className = 'entitlements-table__badge label-xxs';
        badge.dataset.status = metaEntry.enforcement.status || 'gap';
        badge.textContent = metaEntry.enforcement.status === 'enforced' ? 'Enforced' : 'Enforcement gap';
        enforcement.appendChild(badge);
        const owner = document.createElement('span');
        owner.className = 'entitlements-table__owner';
        owner.textContent = metaEntry.enforcement.owner || metaEntry.enforcement.note || '';
        if (metaEntry.enforcement.note) owner.title = metaEntry.enforcement.note;
        enforcement.appendChild(owner);
        descStack.appendChild(enforcement);
      }
      descCell.appendChild(descStack);
      row.appendChild(descCell);

      tiers.forEach((tier) => {
        row.appendChild(createEditableValueCell({ key, entitlement, tier }));
      });

      const tokenCell = document.createElement('td');
      tokenCell.textContent = key;
      tokenCell.className = 'body-s entitlements-table__token';
      row.appendChild(tokenCell);

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    appendTable(section, table);
    return section;
  }

  function renderReadonlyToggleCell({ id, checked, label, title }) {
    const td = document.createElement('td');
    td.className = 'body-s entitlements-table__value';

    const safeId = String(id).replace(/[^a-zA-Z0-9_-]+/g, '_');

    const cell = document.createElement('div');
    cell.className = 'entitlements-cell entitlements-cell--flag';
    td.appendChild(cell);

    const wrapper = document.createElement('label');
    wrapper.className = 'diet-toggle';
    wrapper.setAttribute('data-size', 'md');
    if (title) wrapper.title = title;
    wrapper.innerHTML = `
      <span class="diet-toggle__label sr-only" id="${safeId}-label">${String(label || 'Enabled')}</span>
      <input id="${safeId}" class="diet-toggle__input sr-only" type="checkbox" role="switch" aria-labelledby="${safeId}-label" />
      <span class="diet-toggle__switch" aria-hidden="true">
        <span class="diet-toggle__knob"></span>
      </span>
    `;

    const input = wrapper.querySelector('input');
    if (input) {
      input.checked = Boolean(checked);
      input.disabled = true;
      input.tabIndex = -1;
    }

    cell.appendChild(wrapper);
    return td;
  }

  function normalizeTierLabel(tier) {
    return String(tier || '').replace(/\b\w/g, (c) => c.toUpperCase());
  }

  function getAiRuntimeConfig(agentId, tier) {
    return state.aiRuntimeMatrix?.agents?.[agentId]?.[tier] || null;
  }

  function labelProvider(provider) {
    const found = aiProviders.find((entry) => entry.provider === provider);
    return found?.label || provider;
  }

  function labelModel(provider, model) {
    const found = aiModels.find((entry) => entry.provider === provider && entry.model === model);
    return found?.label || model;
  }

  function isModelAllowed(config, provider, model) {
    const allowed = config?.modelsByProvider?.[provider]?.allowed;
    return Array.isArray(allowed) && allowed.includes(model);
  }

  function getRuntimeModelOptions(agent) {
    const supported = new Set((agent.supportedProviders || []).map((entry) => entry.provider));
    const seen = new Set();
    const out = [];
    aiModels.forEach((model) => {
      if (!supported.has(model.provider)) return;
      const key = `${model.provider}:${model.model}`;
      if (seen.has(key)) return;
      seen.add(key);
      out.push(model);
    });
    return out.sort((a, b) => `${a.provider}:${a.label || a.model}`.localeCompare(`${b.provider}:${b.label || b.model}`));
  }

  function renderAiCatalog() {
    if (!aiModels.length) return null;

    const section = document.createElement('section');
    section.className = 'entitlements-section';

    const heading = document.createElement('h2');
    heading.className = 'heading-4';
    heading.textContent = 'AI Model Catalog';
    section.appendChild(heading);

    const hint = document.createElement('p');
    hint.className = 'body-s entitlements-ai__hint';
    hint.textContent = 'Read-only. This is every LLM/model Clickeen knows how to call; runtime access is set per copilot or system agent below.';
    section.appendChild(hint);

    const table = document.createElement('table');
    table.className = 'body-s entitlements-table';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['LLM', 'Model / ID'].forEach((label) => {
      const th = document.createElement('th');
      th.className = 'label-s';
      th.textContent = label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const providerLabels = new Map(aiProviders.map((provider) => [provider.provider, provider.label || provider.provider]));
    const tbody = document.createElement('tbody');
    aiModels
      .slice()
      .sort((a, b) => {
        const providerA = String(providerLabels.get(a.provider) || a.provider);
        const providerB = String(providerLabels.get(b.provider) || b.provider);
        return `${providerA}:${a.label || a.model}`.localeCompare(`${providerB}:${b.label || b.model}`);
      })
      .forEach((model) => {
        const row = document.createElement('tr');
        row.className = 'entitlements-ai-row entitlements-ai-row--model';
        row.innerHTML = `
          <td class="body-s entitlements-table__name entitlements-ai-row__name">${providerLabels.get(model.provider) || model.provider}</td>
          <td class="body-s entitlements-table__desc">
            <span class="body-s entitlements-ai-row__model-label">${model.label || model.model}</span>
            <span class="body-s entitlements-table__token">${model.provider}:${model.model}</span>
          </td>
        `;
        tbody.appendChild(row);
      });

    table.appendChild(tbody);
    appendTable(section, table);
    return section;
  }

  function renderEditableAiToggleCell({ id, checked, label, pendingKey, onChange }) {
    const td = renderReadonlyToggleCell({ id, checked, label });
    const input = td.querySelector('input');
    const cell = td.querySelector('.entitlements-cell') || td;
    if (input) {
      input.disabled = state.busy;
      input.tabIndex = 0;
      input.addEventListener('change', async () => {
        try {
          await onChange(input.checked);
        } catch (_err) {
          input.checked = !input.checked;
        }
      });
      appendPendingControlState(cell, input, pendingKey);
    }
    return td;
  }

  function renderReadonlyValueCell(value) {
    const td = document.createElement('td');
    td.className = 'body-s entitlements-table__value';
    td.textContent = value === null || typeof value === 'undefined' ? 'none' : String(value);
    return td;
  }

  function renderAiNumberCell({ agentId, tier, field, value, allowNull = false }) {
    const td = document.createElement('td');
    td.className = 'body-s entitlements-table__value';
    const cell = document.createElement('div');
    cell.className = 'entitlements-cell';

    const input = document.createElement('input');
    input.className = 'diet-valuefield__field';
    input.type = 'text';
    input.inputMode = 'decimal';
    input.disabled = state.busy;
    input.placeholder = allowNull ? 'none' : '0';
    input.value = value === null || typeof value === 'undefined' ? '' : String(value);
    input.setAttribute('aria-label', `${agentId} ${tier} ${field}`);
    const payload = { agentId, tier, field };

    const commit = async () => {
      const parsed = parseNumberish(input.value);
      const nextValue = parsed === null && allowNull ? null : parsed;
      try {
        await saveAiRuntimeCell({ ...payload, value: nextValue });
      } catch (_err) {
        const config = getAiRuntimeConfig(agentId, tier);
        const current =
          field === 'maxTurnsPerThread'
            ? config?.maxTurnsPerThread
            : config?.budget?.[field];
        input.value = current === null || typeof current === 'undefined' ? '' : String(current);
      }
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        input.blur();
      }
    });
    cell.appendChild(input);
    appendPendingControlState(cell, input, aiControlKey(payload));
    td.appendChild(cell);
    return td;
  }

  function renderDefaultModelCell({ agent, tier, config, editable }) {
    if (!editable) {
      return renderReadonlyValueCell(`${labelProvider(config?.defaultModel?.provider)} / ${labelModel(config?.defaultModel?.provider, config?.defaultModel?.model)}`);
    }

    const td = document.createElement('td');
    td.className = 'body-s entitlements-table__value';
    const cell = document.createElement('div');
    cell.className = 'entitlements-cell';

    const select = document.createElement('select');
    select.className = 'entitlements-unit body-xs';
    select.disabled = state.busy;
    select.setAttribute('aria-label', `${agent.agentId} ${tier} default model`);
    const payload = { agentId: agent.agentId, tier, field: 'defaultModel' };

    Object.entries(config?.modelsByProvider || {}).forEach(([provider, policy]) => {
      (policy?.allowed || []).forEach((model) => {
        const option = document.createElement('option');
        option.value = `${provider}::${model}`;
        option.textContent = `${labelProvider(provider)} / ${labelModel(provider, model)}`;
        option.selected = config?.defaultModel?.provider === provider && config?.defaultModel?.model === model;
        select.appendChild(option);
      });
    });

    select.addEventListener('change', async () => {
      const [provider, model] = String(select.value || '').split('::');
      try {
        await saveAiRuntimeCell({ ...payload, value: { provider, model } });
      } catch (_err) {
        render();
      }
    });
    cell.appendChild(select);
    appendPendingControlState(cell, select, aiControlKey(payload));
    td.appendChild(cell);
    return td;
  }

  function renderRuntimePolicyTable({ title, hintText, agents, tiers, editable }) {
    if (!Array.isArray(agents) || !agents.length || !tiers.length) return null;

    const section = document.createElement('section');
    section.className = 'entitlements-section';

    const heading = document.createElement('h2');
    heading.className = 'heading-4';
    heading.textContent = title;
    section.appendChild(heading);

    const hint = document.createElement('p');
    hint.className = 'body-s entitlements-ai__hint';
    hint.textContent = hintText;
    section.appendChild(hint);

    if (!state.aiRuntimeMatrix) {
      section.appendChild(createLoadingState());
      return section;
    }

    const table = document.createElement('table');
    table.className = 'body-s entitlements-table';

    const colgroup = document.createElement('colgroup');
    const colName = document.createElement('col');
    colName.className = 'entitlements-table__name-col';
    const colDesc = document.createElement('col');
    colDesc.className = 'entitlements-table__desc-col';
    colgroup.append(colName, colDesc);
    tiers.forEach(() => {
      const col = document.createElement('col');
      col.className = 'entitlements-table__tier';
      colgroup.appendChild(col);
    });
    const colToken = document.createElement('col');
    colToken.className = 'entitlements-table__token-col';
    colgroup.appendChild(colToken);
    table.appendChild(colgroup);

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['Agent', 'Setting'].forEach((label) => {
      const th = document.createElement('th');
      th.className = 'label-s';
      th.textContent = label;
      headRow.appendChild(th);
    });
    tiers.forEach((tier) => {
      const th = document.createElement('th');
      th.className = 'label-s entitlements-table__tier-head';
      const label = document.createElement('span');
      label.className = 'label-s entitlements-tier-label';
      label.textContent = normalizeTierLabel(tier);
      th.appendChild(label);
      headRow.appendChild(th);
    });
    const tokenHeader = document.createElement('th');
    tokenHeader.textContent = 'ID';
    tokenHeader.className = 'label-s entitlements-table__token-head';
    headRow.appendChild(tokenHeader);
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    agents.forEach((agent) => {
      const addRow = ({ name, desc, token, cells }) => {
        const row = document.createElement('tr');
        const nameCell = document.createElement('td');
        nameCell.className = 'body-s entitlements-table__name';
        nameCell.textContent = name;
        row.appendChild(nameCell);
        const descCell = document.createElement('td');
        descCell.className = 'body-s entitlements-table__desc';
        descCell.textContent = desc;
        row.appendChild(descCell);
        cells.forEach((cell) => row.appendChild(cell));
        const tokenCell = document.createElement('td');
        tokenCell.className = 'body-s entitlements-table__token';
        tokenCell.textContent = token;
        row.appendChild(tokenCell);
        tbody.appendChild(row);
      };

      addRow({
        name: agent.description || agent.agentId,
        desc: `${agent.category === 'copilot' ? 'Customer copilot' : 'System agent'} · ${agent.executionSurface}`,
        token: agent.agentId,
        cells: tiers.map((tier) => {
          const tierEntry = agent.byTier?.[tier];
          const enabled = Boolean(tierEntry?.enabled);
          return renderReadonlyToggleCell({
            id: `ai_agent_${agent.agentId}_${tier}`,
            checked: enabled,
            label: `${agent.agentId} ${normalizeTierLabel(tier)} enabled`,
            title: enabled ? 'Enabled by account policy' : `Blocked by entitlement: ${tierEntry?.deniedEntitlement || 'unknown'}`,
          });
        }),
      });

      addRow({
        name: 'Default model',
        desc: 'The model selected when the user has not chosen one.',
        token: 'defaultModel',
        cells: tiers.map((tier) => renderDefaultModelCell({ agent, tier, config: getAiRuntimeConfig(agent.agentId, tier), editable })),
      });

      getRuntimeModelOptions(agent).forEach((model) => {
        addRow({
          name: `${labelProvider(model.provider)} / ${model.label || model.model}`,
          desc: 'Allowed model',
          token: `${model.provider}:${model.model}`,
          cells: tiers.map((tier) => {
            const config = getAiRuntimeConfig(agent.agentId, tier);
            const checked = isModelAllowed(config, model.provider, model.model);
            if (!editable) {
              return renderReadonlyToggleCell({
                id: `ai_allowed_${agent.agentId}_${model.provider}_${model.model}_${tier}`,
                checked,
                label: `${agent.agentId} ${model.model} ${tier} allowed`,
              });
            }
            const pendingPayload = {
              agentId: agent.agentId,
              tier,
              field: 'allowedModel',
              provider: model.provider,
              model: model.model,
            };
            return renderEditableAiToggleCell({
              id: `ai_allowed_${agent.agentId}_${model.provider}_${model.model}_${tier}`,
              checked,
              label: `${agent.agentId} ${model.model} ${tier} allowed`,
              pendingKey: aiControlKey(pendingPayload),
              onChange: (value) =>
                saveAiRuntimeCell({
                  ...pendingPayload,
                  value,
                }),
            });
          }),
        });
      });

      [
        ['allowModelPicker', 'Model picker', 'User can choose among allowed models.'],
        ['maxTokens', 'Max tokens', 'Maximum output tokens per call.'],
        ['timeoutMs', 'Timeout ms', 'Call timeout in milliseconds.'],
        ['maxTurnsPerThread', 'Turns/thread', 'Maximum chat turns in one thread.'],
      ].forEach(([field, name, desc]) => {
        addRow({
          name,
          desc,
          token: field,
          cells: tiers.map((tier) => {
            const config = getAiRuntimeConfig(agent.agentId, tier);
            const value =
              field === 'allowModelPicker'
                ? config?.allowModelPicker
                : field === 'maxTurnsPerThread'
                  ? config?.maxTurnsPerThread
                  : config?.budget?.[field];
            if (field === 'allowModelPicker') {
              if (!editable) {
                return renderReadonlyToggleCell({ id: `ai_${field}_${agent.agentId}_${tier}`, checked: Boolean(value), label: `${agent.agentId} ${tier} ${field}` });
              }
              const pendingPayload = { agentId: agent.agentId, tier, field };
              return renderEditableAiToggleCell({
                id: `ai_${field}_${agent.agentId}_${tier}`,
                checked: Boolean(value),
                label: `${agent.agentId} ${tier} ${field}`,
                pendingKey: aiControlKey(pendingPayload),
                onChange: (nextValue) => saveAiRuntimeCell({ ...pendingPayload, value: nextValue }),
              });
            }
            return editable
              ? renderAiNumberCell({ agentId: agent.agentId, tier, field, value })
              : renderReadonlyValueCell(value);
          }),
        });
      });
    });

    table.appendChild(tbody);
    appendTable(section, table);
    return section;
  }

  function renderOperationFeedback(container) {
    if (!state.feedback) return;
    if (state.feedback.kind === 'loading') {
      container.appendChild(createLoadingState());
      return;
    }
    const feedback = document.createElement('p');
    feedback.className = 'body-s entitlements-operation-feedback';
    feedback.setAttribute('role', state.feedback.kind === 'alert' ? 'alert' : 'status');
    feedback.textContent = state.feedback.message;
    container.appendChild(feedback);
  }

  function createLoadingState() {
    const loading = document.createElement('div');
    loading.className = 'diet-loading-state';
    loading.setAttribute('role', 'status');
    loading.setAttribute('aria-label', 'Loading');
    const spinner = document.createElement('span');
    spinner.className = 'diet-spinner';
    spinner.setAttribute('data-size', 'medium');
    spinner.setAttribute('aria-hidden', 'true');
    loading.appendChild(spinner);
    return loading;
  }

  function render() {
    if (!root) return;
    root.innerHTML = '';

    if (!meta || Object.keys(meta).length === 0) {
      const warn = document.createElement('p');
      warn.className = 'body-s';
      warn.textContent = 'Missing entitlement metadata. Some labels/descriptions may be empty.';
      root.appendChild(warn);
    }

    renderToolbar();
    renderOperationFeedback(root);

    if (!state.matrix) {
      return;
    }

    const matrix = state.matrix;
    const tiers = Array.isArray(matrix.tiers) ? [...matrix.tiers] : [];
    const preferredTierOrder = ['free', 'tier1', 'tier2', 'tier3', 'tier4'];
    tiers.sort((a, b) => {
      const ia = preferredTierOrder.indexOf(String(a).toLowerCase());
      const ib = preferredTierOrder.indexOf(String(b).toLowerCase());
      const ra = ia === -1 ? 999 : ia;
      const rb = ib === -1 ? 999 : ib;
      if (ra !== rb) return ra - rb;
      return String(a).localeCompare(String(b));
    });
    const sortEntries = (entries) => {
      entries.sort((a, b) => {
        const ma = meta[a.key] || { label: '', description: '', enforcement: null };
        const mb = meta[b.key] || { label: '', description: '', enforcement: null };
        const la = String(ma.label || '').trim();
        const lb = String(mb.label || '').trim();
        if (la && lb && la !== lb) return la.localeCompare(lb);
        return String(a.key).localeCompare(String(b.key));
      });
      return entries;
    };

    const planLimitEntries = sortEntries(Object.entries(matrix.entitlements).map(([key, entitlement]) => ({ key, entitlement })));
    root.appendChild(renderTable({ title: 'Plan Limits', entries: planLimitEntries, tiers }));

    const aiCatalogSection = renderAiCatalog();
    if (aiCatalogSection) root.appendChild(aiCatalogSection);

    const copilotRuntimeSection = renderRuntimePolicyTable({
      title: 'Customer Copilots',
      hintText: 'Editable. These local JSON values decide what customer-facing copilots can use after git deploy.',
      agents: aiCopilots,
      tiers,
      editable: true,
    });
    if (copilotRuntimeSection) root.appendChild(copilotRuntimeSection);

    const systemAgentSection = renderRuntimePolicyTable({
      title: 'System Agents',
      hintText: 'Read-only here. These are internal Clickeen agents from the same registry and runtime JSON.',
      agents: aiSystemAgents,
      tiers,
      editable: false,
    });
    if (systemAgentSection) root.appendChild(systemAgentSection);
  }

  if (!root) {
    throw new Error('Entitlements root node not found');
  }

  render();
  Promise.all([fetchMatrix(), fetchAiRuntimeMatrix()])
    .then(([next, nextAiRuntime]) => {
      setStatus({
        matrix: next.matrix,
        matrixPath: next.path,
        aiRuntimeMatrix: nextAiRuntime.matrix,
        aiRuntimePath: nextAiRuntime.path,
        busy: false,
        feedback: null,
      });
    })
    .catch((_err) => {
      setStatus({ busy: false, feedback: { kind: 'alert', message: POLICY_COPY.loadFailed } });
    });
</script>
