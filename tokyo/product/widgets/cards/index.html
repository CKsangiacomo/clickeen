<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards Widget</title>
    <link rel="stylesheet" href="/dieter/tokens/tokens.css" />
    <link rel="stylesheet" href="../shared/header.css" />
    <link rel="stylesheet" href="../shared/localeSwitcher.css" />
    <link rel="stylesheet" href="../shared/stagePod.css" />
    <link rel="stylesheet" href="../shared/socialShare.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage" data-role="stage">
      <div class="pod" data-role="pod">
        <div class="ck-widget ck-cards-widget" data-ck-widget="cards" data-role="root">
          <section class="ck-cards ck-headerLayout" data-role="cards">
            <header class="ck-cards__header ck-header" {{#unless header.enabled}}hidden{{/unless}}>
              <div class="ck-header__text">
                <h2 class="ck-cards__title ck-header__title heading-2" data-role="header-title" data-ck-field-path="header.title" data-ck-field-target="richtext">{{header.title}}</h2>
                <div class="ck-header__subtitle" data-role="header-subtitle" data-ck-field-path="header.subtitleHtml" data-ck-field-target="richtext" {{#unless header.showSubtitle}}hidden{{/unless}}>{{header.subtitleHtml}}</div>
              </div>
              <a class="ck-header__cta" data-role="header-cta" href="{{headerCta.href}}" data-open-mode="{{headerCta.openMode}}" {{#unless headerCta.enabled}}hidden{{/unless}}>
                <span class="ck-header__ctaIcon" aria-hidden="true"></span>
                <span class="ck-header__ctaLabel" data-ck-field-path="headerCta.label" data-ck-field-target="text">{{headerCta.label}}</span>
              </a>
            </header>
            <div class="ck-cards__core ck-headerLayout__body" data-role="cards-core">
              <div class="ck-cards__grid" data-treatment="{{cards.treatment}}" style="--ck-cards-columns: {{cards.columns}}; --ck-cards-gap: {{cards.gap}}px">
                {{#each cards.items}}
                <div class="ck-cards__slot" data-item-id="{{id}}">
                  <article class="ck-cards__card" data-media-kind="{{media.kind}}" style="--ck-cards-card-padding: {{../cards.cardPadding}}px">
                    {{#if media.iconName}}
                    <div class="ck-cards__media" data-media-variant="icon"><span class="ck-cards__icon" aria-hidden="true" style="--ck-cards-icon: url('/dieter/icons/svg/{{media.iconName}}.svg')"></span></div>
                    {{/if}}
                    {{#if media.image.image}}
                    <div class="ck-cards__media" data-media-variant="image"><img class="ck-cards__image" src="{{media.image.image.src}}" alt="{{media.imageAlt}}" loading="lazy" data-ck-field-path="{{@path}}.media.imageAlt" data-ck-field-target="attribute:alt" /></div>
                    {{/if}}
                    <h3 class="ck-cards__title heading-3" data-ck-field-path="{{@path}}.title" data-ck-field-target="text">{{title}}</h3>
                    <div class="ck-cards__copy body-l" data-ck-field-path="{{@path}}.copy" data-ck-field-target="richtext">{{copy}}</div>
                    {{#if link.enabled}}
                    <a class="ck-cards__linkLabel label-s" href="{{link.href}}" data-ck-field-path="{{@path}}.link.label" data-ck-field-target="text">{{link.label}}</a>
                    {{/if}}
                  </article>
                  {{#if ../cards.betweenCards.enabled}}<span class="ck-cards__between" data-kind="{{../cards.betweenCards.kind}}" data-axis="x" aria-hidden="true"></span>{{/if}}
                </div>
                {{/each}}
              </div>
            </div>
          </section>
          <script src="./runtime.js" defer></script>
        </div>
      </div>
    </div>
  </body>
</html>
