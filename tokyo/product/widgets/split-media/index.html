<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Media Widget</title>
    <link rel="stylesheet" href="/dieter/tokens/tokens.css" />
    <link rel="stylesheet" href="../shared/header.css" />
    <link rel="stylesheet" href="../shared/localeSwitcher.css" />
    <link rel="stylesheet" href="../shared/stagePod.css" />
    <link rel="stylesheet" href="../shared/socialShare.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage" data-role="stage">
      <div class="pod" data-role="pod">
        <div class="ck-widget ck-split-media-widget" data-ck-widget="split-media" data-role="root">
          <section class="ck-split-media ck-headerLayout" data-role="split-media">
            <header class="ck-split-media__header ck-header" {{#unless header.enabled}}hidden{{/unless}}>
              <div class="ck-header__text">
                <h2 class="ck-split-media__title ck-header__title heading-2" data-role="header-title" data-ck-field-path="header.title" data-ck-field-target="richtext">{{header.title}}</h2>
                <div class="ck-header__subtitle" data-role="header-subtitle" data-ck-field-path="header.subtitleHtml" data-ck-field-target="richtext" {{#unless header.showSubtitle}}hidden{{/unless}}>{{header.subtitleHtml}}</div>
              </div>
              <a class="ck-header__cta" data-role="header-cta" href="{{headerCta.href}}" data-open-mode="{{headerCta.openMode}}" {{#unless headerCta.enabled}}hidden{{/unless}}><span class="ck-header__ctaIcon" aria-hidden="true"></span><span class="ck-header__ctaLabel" data-ck-field-path="headerCta.label" data-ck-field-target="text">{{headerCta.label}}</span></a>
            </header>
            <div class="ck-split-media__core ck-headerLayout__body" data-role="split-media-core" style="--ck-split-media-fit: {{splitMedia.fit}}; --ck-split-media-position: {{splitMedia.position}}">
              <div class="ck-split-media__stage" role="group" aria-roledescription="visual" aria-label="Split media visual">
                <div class="ck-split-media__media" {{#unless splitMedia.media.image}}{{#unless splitMedia.media.video}}data-empty="true" aria-label="No media selected"{{/unless}}{{/unless}}>
                  {{#if splitMedia.media.image}}<img src="{{splitMedia.media.image.src}}" alt="{{splitMedia.alt}}" loading="lazy" data-ck-field-path="splitMedia.alt" data-ck-field-target="attribute:alt" />{{/if}}
                  {{#if splitMedia.media.video}}<video src="{{splitMedia.media.video.src}}" {{#if splitMedia.media.video.poster}}poster="{{splitMedia.media.video.poster}}"{{/if}} {{#if splitMedia.media.video.autoplay}}autoplay{{/if}} {{#if splitMedia.media.video.loop}}loop{{/if}} {{#if splitMedia.media.video.muted}}muted{{/if}} playsinline aria-label="{{splitMedia.alt}}"></video>{{/if}}
                </div>
              </div>
            </div>
          </section>
          <script src="./runtime.js" defer></script>
        </div>
      </div>
    </div>
  </body>
</html>
