<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{header.title}} | FAQ</title>
    <link rel="stylesheet" href="/dieter/tokens/tokens.css" />
    <link rel="stylesheet" href="/dieter/components/button/button.css" />
    <link rel="stylesheet" href="../shared/header.css" />
    <link rel="stylesheet" href="../shared/localeSwitcher.css" />
    <link rel="stylesheet" href="../shared/stagePod.css" />
    <link rel="stylesheet" href="../shared/socialShare.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage" data-role="stage">
      <div class="pod" data-role="pod">
        <main class="ck-widget ck-faq-widget" data-ck-widget="faq" data-role="root">
          <section class="ck-faq ck-headerLayout" data-role="faq" data-layout="{{faq.layout.type}}" data-cards-layout="{{faq.layout.cardsLayout}}" data-qa-gap="{{faq.layout.itemQaGapPreset}}" data-link-style="{{faq.appearance.linkStyle}}" data-icon-style="{{faq.appearance.iconStyle}}" data-multi-open="{{faq.behavior.multiOpen}}" data-expand-all="{{faq.behavior.expandAll}}" data-expand-first="{{faq.behavior.expandFirst}}" data-deep-links="{{faq.geo.enableDeepLinks}}" style="--layout-gap: {{faq.layout.gap}}px; --faq-columns-desktop: {{faq.layout.columns.desktop}}; --faq-columns-mobile: {{faq.layout.columns.mobile}}; --faq-qa-gap-custom: {{faq.layout.itemQaGapCustom}}px; --faq-item-pad-top: {{#if faq.layout.itemPaddingLinked}}{{faq.layout.itemPadding}}{{/if}}{{#unless faq.layout.itemPaddingLinked}}{{faq.layout.itemPaddingTop}}{{/unless}}px; --faq-item-pad-right: {{#if faq.layout.itemPaddingLinked}}{{faq.layout.itemPadding}}{{/if}}{{#unless faq.layout.itemPaddingLinked}}{{faq.layout.itemPaddingRight}}{{/unless}}px; --faq-item-pad-bottom: {{#if faq.layout.itemPaddingLinked}}{{faq.layout.itemPadding}}{{/if}}{{#unless faq.layout.itemPaddingLinked}}{{faq.layout.itemPaddingBottom}}{{/unless}}px; --faq-item-pad-left: {{#if faq.layout.itemPaddingLinked}}{{faq.layout.itemPadding}}{{/if}}{{#unless faq.layout.itemPaddingLinked}}{{faq.layout.itemPaddingLeft}}{{/unless}}px;">
            <header class="ck-faq__header ck-header" {{#unless header.enabled}}hidden{{/unless}}>
              <div class="ck-header__text">
                <h2 class="ck-faq__title ck-header__title heading-4" data-role="header-title" data-ck-field-path="header.title" data-ck-field-target="richtext">{{header.title}}</h2>
                <div class="ck-header__subtitle" data-role="header-subtitle" data-ck-field-path="header.subtitleHtml" data-ck-field-target="richtext" {{#unless header.showSubtitle}}hidden{{/unless}}>{{header.subtitleHtml}}</div>
              </div>
              <a class="ck-header__cta" data-role="header-cta" href="{{headerCta.href}}" data-open-mode="{{headerCta.openMode}}" {{#unless headerCta.enabled}}hidden{{/unless}}><span class="ck-header__ctaIcon" aria-hidden="true"></span><span class="ck-header__ctaLabel" data-ck-field-path="headerCta.label" data-ck-field-target="text">{{headerCta.label}}</span></a>
            </header>
            <div class="ck-faq__body ck-headerLayout__body" data-role="faq-core">
              <ul class="ck-faq__sections" data-role="faq-list">
                {{#each faq.sections}}
                <li class="ck-faq__section" data-role="faq-section">
                  {{#if ../faq.displayCategoryTitles}}<div class="ck-faq__section-header" data-role="faq-section-header"><h3 class="ck-faq__category" data-role="faq-section-title" data-ck-field-path="{{@path}}.title" data-ck-field-target="text">{{title}}</h3></div>{{/if}}
                  <ul class="ck-faq__list" data-role="faq-section-body">
                    {{#each faqs}}
                    <li class="ck-faq__item" data-role="faq-item" id="faq-{{id}}" data-default-open="{{defaultOpen}}">
                      <button class="ck-faq__q" data-role="faq-question" type="button" aria-expanded="false" aria-controls="faq-answer-{{id}}">
                        <span class="ck-faq__q-text" data-role="faq-question-text" data-ck-field-path="{{@path}}.question" data-ck-field-target="text">{{question}}</span>
                        <span class="ck-faq__icon" aria-hidden="true"></span>
                      </button>
                      <div class="ck-faq__a" data-role="faq-answer" role="region" id="faq-answer-{{id}}" data-ck-field-path="{{@path}}.answer" data-ck-field-target="richtext">{{answer}}</div>
                    </li>
                    {{/each}}
                  </ul>
                </li>
                {{/each}}
              </ul>
            </div>
          </section>
          <script src="./runtime.js" defer></script>
        </main>
      </div>
    </div>
  </body>
</html>
