name: cloud-dev roma app verify

on:
  push:
    branches: [main]
    paths:
      - 'roma/**'
      - 'bob/**'
      - 'tokyo/product/widgets/**'
      - 'dieter/**'
      - 'packages/**'
      - 'scripts/build-bob-cf.mjs'
      - 'scripts/build-roma-cf.mjs'
      - 'scripts/widgets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.app-base.json'
      - '.github/workflows/cloud-dev-roma-app.yml'
  workflow_dispatch: {}

concurrency:
  group: cloud-dev-roma
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL_CLOUD_DEV }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_CLOUD_DEV }}

      NEXT_PUBLIC_TOKYO_URL: https://tokyo.dev.clickeen.com
      BERLIN_BASE_URL: https://berlin.dev.clickeen.com
      PRODUCT_COPILOT_BASE_URL: https://product-copilot-dev.clickeen.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: {}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Policy entitlement contracts
        run: pnpm --filter @clickeen/ck-policy test:entitlements

      - name: Roma Copilot usage contracts
        run: pnpm --filter @clickeen/roma test:account-limit-usage

      - name: Runtime materializer contracts
        run: pnpm --filter @clickeen/ck-runtime-materializer test

      - name: Bob editor contracts
        run: pnpm --filter @clickeen/bob test

      - name: Detect Bob build requirement
        id: bob_build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi

          if git diff --name-only --no-renames "$before" "$after" | grep -Eq '^(bob/|dieter/|packages/|scripts/build-bob-cf\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.app-base\.json$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Bob Pages contract
        if: steps.bob_build.outputs.required == 'true'
        run: pnpm -C bob build:cf

      - name: Build Roma Pages contract
        run: pnpm -C roma build:cf
