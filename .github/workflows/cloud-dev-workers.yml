name: cloud-dev workers deploy

on:
  push:
    branches: [main]
    paths:
      - 'berlin/**'
      - 'agents/product-copilot/**'
      - 'agents/translation-agent/**'
      - 'sanfrancisco/**'
      - 'tokyo-worker/**'
      - 'tokyo/product/fonts/**'
      - 'tokyo/prague/**'
      - 'dieter/icons/svg/**'
      - 'packages/ck-contracts/**'
      - 'packages/ck-policy/**'
      - 'packages/l10n/**'
      - 'packages/widget-foundation/**'
      - 'scripts/tokyo-r2-deploy-sync.mjs'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.app-base.json'
      - '.github/workflows/cloud-dev-workers.yml'
  workflow_dispatch: {}

concurrency:
  group: cloud-dev-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKYO_R2_BUCKET: tokyo-assets-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: {}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Policy entitlement contracts
        run: pnpm --filter @clickeen/ck-policy test:entitlements

      - name: Roma AI grant signature contracts
        run: pnpm --filter @clickeen/ck-policy test:ai-grants

      - name: San Francisco grant contracts
        run: pnpm --filter @clickeen/sanfrancisco test:grants

      - name: Berlin auth boundary
        run: pnpm --filter @clickeen/berlin verify:auth-boundary

      - name: Tokyo auth config
        run: pnpm --filter @clickeen/tokyo-worker test:auth-config

      - name: Roma Tokyo-boundary contracts
        run: pnpm --filter @clickeen/roma test:tokyo-client-failures

      - name: Detect changed worker surfaces
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "berlin=true"
              echo "product_copilot=true"
              echo "translation_agent=true"
              echo "sanfrancisco=true"
              echo "tokyo=true"
              echo "tokyo_assets=true"
              echo "tokyo_assets_mode=full"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi

          changed="$(git diff --name-only --no-renames "$before" "$after")"
          path_changed() {
            printf '%s\n' "$changed" | grep -Eq "$1"
          }

          berlin=false
          product_copilot=false
          translation_agent=false
          sanfrancisco=false
          tokyo=false
          tokyo_assets=false
          tokyo_assets_mode=none

          workflow_changed=false
          if path_changed '^\.github/workflows/cloud-dev-workers\.yml$'; then
            workflow_changed=true
          fi

          dependency_graph_changed=false
          if path_changed '^(pnpm-workspace\.yaml|pnpm-lock\.yaml|tsconfig\.app-base\.json)$'; then
            dependency_graph_changed=true
          fi

          if [ "$workflow_changed" = "true" ] || [ "$dependency_graph_changed" = "true" ] || path_changed '^(berlin/|packages/(ck-policy|ck-contracts|l10n)/)'; then
            berlin=true
          fi

          if [ "$workflow_changed" = "true" ] || [ "$dependency_graph_changed" = "true" ] || path_changed '^(agents/product-copilot/|packages/ck-contracts/)'; then
            product_copilot=true
          fi

          if [ "$workflow_changed" = "true" ] || [ "$dependency_graph_changed" = "true" ] || path_changed '^(agents/translation-agent/|packages/(ck-contracts|ck-policy|l10n)/)'; then
            translation_agent=true
          fi

          if [ "$workflow_changed" = "true" ] || [ "$dependency_graph_changed" = "true" ] || path_changed '^(sanfrancisco/|packages/(ck-contracts|ck-policy|l10n)/)'; then
            sanfrancisco=true
          fi

          if [ "$workflow_changed" = "true" ] || [ "$dependency_graph_changed" = "true" ] || path_changed '^(tokyo-worker/|packages/(ck-contracts|ck-policy|l10n|widget-foundation)/)'; then
            tokyo=true
          fi

          if [ "$workflow_changed" = "true" ] || path_changed '^(tokyo/prague/|scripts/tokyo-r2-deploy-sync\.mjs$)'; then
            tokyo_assets=true
            tokyo_assets_mode=full
          elif path_changed '^(dieter/icons/svg/|tokyo/product/fonts/)'; then
            tokyo_assets=true
            tokyo_assets_mode=delta
          fi

          {
            echo "berlin=$berlin"
            echo "product_copilot=$product_copilot"
            echo "translation_agent=$translation_agent"
            echo "sanfrancisco=$sanfrancisco"
            echo "tokyo=$tokyo"
            echo "tokyo_assets=$tokyo_assets"
            echo "tokyo_assets_mode=$tokyo_assets_mode"
            echo "before=$before"
            echo "after=$after"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy berlin-dev
        if: steps.changes.outputs.berlin == 'true'
        run: pnpm -C berlin run deploy

      - name: Sync sanfrancisco-dev signing authorities
        if: steps.changes.outputs.sanfrancisco == 'true'
        env:
          ROMA_AI_GRANT_PUBLIC_KEY_PEM: ${{ secrets.ROMA_AI_GRANT_PUBLIC_KEY_PEM }}
          PRAGUE_L10N_HMAC_SECRET: ${{ secrets.PRAGUE_L10N_HMAC_SECRET }}
        run: |
          if [ -z "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" ] || [ -z "$PRAGUE_L10N_HMAC_SECRET" ]; then
            echo "Missing Roma public key or Prague localization secret for sanfrancisco-dev." >&2
            exit 1
          fi
          printf '%s' "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" | pnpm -C sanfrancisco exec wrangler secret put ROMA_AI_GRANT_PUBLIC_KEY_PEM
          printf '%s' "$PRAGUE_L10N_HMAC_SECRET" | pnpm -C sanfrancisco exec wrangler secret put PRAGUE_L10N_HMAC_SECRET

      - name: Deploy sanfrancisco-dev
        if: steps.changes.outputs.sanfrancisco == 'true'
        run: pnpm -C sanfrancisco run deploy

      - name: Sync tokyo-assets-dev Roma grant public key
        if: steps.changes.outputs.tokyo == 'true'
        env:
          ROMA_AI_GRANT_PUBLIC_KEY_PEM: ${{ secrets.ROMA_AI_GRANT_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" ]; then
            echo "Missing ROMA_AI_GRANT_PUBLIC_KEY_PEM GitHub secret for tokyo-assets-dev." >&2
            exit 1
          fi
          printf '%s' "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" | pnpm -C tokyo-worker exec wrangler secret put ROMA_AI_GRANT_PUBLIC_KEY_PEM

      - name: Deploy tokyo-assets-dev (tokyo-worker)
        if: steps.changes.outputs.tokyo == 'true'
        run: pnpm -C tokyo-worker run deploy

      - name: Deploy product-copilot-dev
        if: steps.changes.outputs.product_copilot == 'true'
        run: pnpm -C agents/product-copilot run deploy

      - name: Sync translation-agent-dev Roma grant public key
        if: steps.changes.outputs.translation_agent == 'true'
        env:
          ROMA_AI_GRANT_PUBLIC_KEY_PEM: ${{ secrets.ROMA_AI_GRANT_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" ]; then
            echo "Missing ROMA_AI_GRANT_PUBLIC_KEY_PEM GitHub secret for translation-agent-dev." >&2
            exit 1
          fi
          printf '%s' "$ROMA_AI_GRANT_PUBLIC_KEY_PEM" | pnpm -C agents/translation-agent exec wrangler secret put ROMA_AI_GRANT_PUBLIC_KEY_PEM

      - name: Deploy translation-agent-dev
        if: steps.changes.outputs.translation_agent == 'true'
        run: pnpm -C agents/translation-agent run deploy

      - name: Sync Tokyo deploy roots to R2 (cloud-dev)
        if: steps.changes.outputs.tokyo_assets == 'true'
        run: |
          if [ "${{ steps.changes.outputs.tokyo_assets_mode }}" = "delta" ]; then
            node scripts/tokyo-r2-deploy-sync.mjs --remote --before "${{ steps.changes.outputs.before }}" --after "${{ steps.changes.outputs.after }}"
          else
            node scripts/tokyo-r2-deploy-sync.mjs --remote
          fi
