name: temporary cloud-dev retired AI cleanup

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact cleanup phase
        required: true
        type: choice
        options:
          - retired-learning-r2
          - retired-d1
          - obsolete-worker-secrets

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: {}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete the retired learning prefix only
        if: inputs.phase == 'retired-learning-r2'
        shell: bash
        env:
          CLOUDFLARE_R2_REST_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/retired-learning-objects.tsv"
          after="$RUNNER_TEMP/retired-learning-objects-after.tsv"

          node scripts/cloudflare/r2.mjs preflight \
            --bucket sanfrancisco-logs-dev \
            --prefix learning/dev/
          node scripts/cloudflare/r2.mjs ls learning/dev/ \
            --bucket sanfrancisco-logs-dev \
            --limit 100000 > "$before"

          while IFS=$'\t' read -r key _; do
            [ -n "$key" ] || continue
            case "$key" in
              learning/dev/*) ;;
              *) echo "Refusing unexpected R2 key: $key" >&2; exit 1 ;;
            esac
            pnpm dlx wrangler@4.54.0 r2 object delete \
              "sanfrancisco-logs-dev/$key" --remote
          done < "$before"

          node scripts/cloudflare/r2.mjs ls learning/dev/ \
            --bucket sanfrancisco-logs-dev \
            --limit 1 > "$after"
          if [ -s "$after" ]; then
            echo 'Retired San Francisco learning objects still exist.' >&2
            cat "$after" >&2
            exit 1
          fi

      - name: Delete the retired D1 database
        if: inputs.phase == 'retired-d1'
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/d1-before.json"
          after="$RUNNER_TEMP/d1-after.json"
          pnpm dlx wrangler@4.54.0 d1 list --json > "$before"
          database_id="$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const row=rows.find(x=>x.name==='sanfrancisco_d1_dev');process.stdout.write(row?.uuid||row?.id||'')" "$before")"
          if [ -n "$database_id" ]; then
            pnpm dlx wrangler@4.54.0 d1 delete "$database_id" --skip-confirmation
          fi
          pnpm dlx wrangler@4.54.0 d1 list --json > "$after"
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(rows.some(x=>x.name==='sanfrancisco_d1_dev'))process.exit(1)" "$after"

      - name: Delete obsolete Worker HMAC secrets
        if: inputs.phase == 'obsolete-worker-secrets'
        shell: bash
        run: |
          set -euo pipefail
          wrangler=(pnpm dlx wrangler@4.54.0)
          for worker in sanfrancisco-dev tokyo-assets-dev translation-agent-dev; do
            before="$RUNNER_TEMP/$worker-secrets-before.json"
            after="$RUNNER_TEMP/$worker-secrets-after.json"
            "${wrangler[@]}" secret list --name "$worker" --format json > "$before"
            if node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(v.some(x=>x.name==='AI_GRANT_HMAC_SECRET')?0:1)" "$before"; then
              printf 'y\n' | "${wrangler[@]}" secret delete AI_GRANT_HMAC_SECRET --name "$worker"
            fi
            "${wrangler[@]}" secret list --name "$worker" --format json > "$after"
            node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(v.some(x=>x.name==='AI_GRANT_HMAC_SECRET'))process.exit(1)" "$after"
          done
